<style>
/* Layout: one-column answer-sheet notebook — sticky top bar (countdown + save state), scrolling sheet, bottom tab bar; 760px max on wide screens */
:root{
  --paper:#F3F5FA;      /* answer-sheet paper (cool) */
  --sheet:#FFFFFF;      /* raised surfaces */
  --sheet-2:#F8F9FC;
  --ink:#1A2132;        /* graphite text */
  --ink-2:#465068;
  --ink-3:#737D93;
  --rule:#DCE1EB;
  --rule-2:#C9D0DE;
  --accent:#3245A6;     /* ETEC indigo ink */
  --accent-2:#2A3A8F;
  --accent-soft:#E7EAF8;
  --on-accent:#FFFFFF;
  --pen:#C0362C;        /* teacher's red pen */
  --pen-soft:#FBEAE7;
  --ok:#2C7A4B; --ok-soft:#E3F2E9;
  --warn:#A86200; --warn-soft:#FFF1D9;
  --due:#7048B6; --due-soft:#EFE9FA;
  --teal:#18808A; --teal-soft:#E1F2F3;
  --hl:#FFE58A;         /* highlighter for key givens */
  --hl-ink:#3A2E00;
  --bubble:#2B303B;     /* pencil-filled bubble */
  --d1:#B06A12; --d2:#3245A6; --d3:#18808A;
  --shadow:0 1px 2px rgba(26,33,50,.06),0 4px 14px rgba(26,33,50,.06);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-read:"Noto Naskh Arabic","IBM Plex Sans Arabic","Geeza Pro",serif;
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E121C; --sheet:#161B28; --sheet-2:#1B2131; --ink:#E7EAF2; --ink-2:#B4BBCC; --ink-3:#8A93A8; --rule:#283044; --rule-2:#344059;
  --accent:#8C9CF2; --accent-2:#A9B5F6; --accent-soft:#232B4D; --on-accent:#0E121C;
  --pen:#F08A80; --pen-soft:#3A1E1D; --ok:#6CCB93; --ok-soft:#16301F; --warn:#F2B152; --warn-soft:#352812; --due:#B9A0F2; --due-soft:#2A2142;

  --d1:#E3A453; --d2:#8C9CF2; --d3:#5CC4CC; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E121C; --sheet:#161B28; --sheet-2:#1B2131; --ink:#E7EAF2; --ink-2:#B4BBCC; --ink-3:#8A93A8; --rule:#283044; --rule-2:#344059;
  --accent:#8C9CF2; --accent-2:#A9B5F6; --accent-soft:#232B4D; --on-accent:#0E121C;
  --pen:#F08A80; --pen-soft:#3A1E1D; --ok:#6CCB93; --ok-soft:#16301F; --warn:#F2B152; --warn-soft:#352812; --due:#B9A0F2; --due-soft:#2A2142;

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin-inline:auto;padding-inline:16px}
/* ---------- top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:0;color:var(--accent);display:flex;align-items:center;gap:8px;margin:0}
.brand small{font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.top-sp{flex:1}
.top .ib{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.top .ib svg{width:22px;height:22px}
.brand{white-space:nowrap}
@media (max-width:430px){#countPill{display:none}.brand small{display:none}}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.cloud{color:var(--ok)} .pill.local{color:var(--warn)} .pill.err{color:var(--pen)}
/* ---------- main + nav */
main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:6px}
.nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);font-size:11.5px;font-weight:600;color:var(--ink-3);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .dot{position:absolute;top:10px;inset-inline-start:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--pen);color:#fff;font-size:10px;display:grid;place-items:center;padding-inline:4px}
/* ---------- type */
.h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.35;margin:0;text-wrap:balance;word-spacing:.12em}
.h2{font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.4;margin:0;text-wrap:balance}
.h3{font-weight:700;font-size:15.5px;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:13px} .tiny{font-size:12px}
.read{font-family:var(--f-read);font-size:17px;line-height:1.95;max-width:65ch}
.read p{margin:0 0 .7em}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-l{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:8px}
/* ---------- surfaces */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-l);padding:16px}
.card.raised{box-shadow:var(--shadow)}
.box{border:1px dashed var(--rule-2);border-radius:var(--r-m);padding:12px 14px;background:var(--sheet-2)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule);min-height:52px}
.li.tap{cursor:pointer}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--ink-3)}
/* ---------- buttons */
.btn{appearance:none;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);text-decoration:none}
.btn:hover{background:var(--accent-2)}
.btn svg{width:18px;height:18px}
.btn.big{min-height:54px;font-size:17px;border-radius:14px;padding-inline:22px;width:100%}
.btn.ghost{background:var(--sheet);color:var(--ink);border-color:var(--rule-2)}
.btn.ghost:hover{background:var(--sheet-2)}
.btn.quiet{background:transparent;color:var(--accent);border-color:transparent;padding-inline:8px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{background:var(--pen);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.end{justify-content:flex-end}
/* ---------- chips & status */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--rule-2);color:var(--ink-2);background:var(--sheet);white-space:nowrap;line-height:1.5}
.chip.chip-wrap{white-space:normal;max-width:100%;text-align:start;border-radius:12px}
.chip svg{width:13px;height:13px;flex:none}
.chip.tog{cursor:pointer;min-height:36px;padding-inline:14px;font-size:13.5px}
.chip.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.st-new{color:var(--ink-3);border-style:dashed}
.st-learning{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.st-needs{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.st-initial{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,transparent);background:var(--teal-soft)}
.st-proven{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-soft)}
.st-due{color:var(--due);border-color:color-mix(in srgb,var(--due) 45%,transparent);background:var(--due-soft)}
.st-planned{color:var(--ink-3);background:var(--sheet-2)}
.src-official{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.src-reference{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.src-generated{color:var(--teal);background:var(--teal-soft);border-color:transparent}
.src-estab{color:var(--ink-2);background:var(--sheet-2)}
.v-verified{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.v-unverified{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.v-conflict{color:var(--pen);background:var(--pen-soft);border-color:transparent}
/* ---------- bars */
.dom{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--rule)}
.dom .nm{font-weight:700}
.dom .vals{font-size:12.5px;color:var(--ink-2);text-align:left}
.track{grid-column:1/-1;position:relative;height:14px;border-radius:7px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.track .cov{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 22%,transparent) 0 4px,transparent 4px 8px);border-inline-end:2px solid color-mix(in srgb,var(--c) 70%,transparent)}
.track .mas{position:absolute;inset-block:3px;inset-inline-start:0;border-radius:4px;background:var(--c);min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:5px}
.mini{height:6px;border-radius:3px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.mini > b{display:block;height:100%;background:var(--accent)}
/* ---------- hero (today) */
.hero{border-radius:var(--r-l);padding:18px;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0 60%,transparent 61%);opacity:.9;pointer-events:none}
.hero > *{position:relative;z-index:1}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:2px;margin:6px 0 4px}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--rule)}
.step:last-child{border-bottom:0}
.step .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.step.done .k{background:var(--bubble);border-color:var(--bubble);color:var(--paper)}
.step.done .t{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.step .t{font-weight:700;font-size:14.5px}
.step .why{font-size:12.5px;color:var(--ink-3)}
.step .m{font-size:12px;color:var(--ink-3);white-space:nowrap}
.count{display:flex;align-items:baseline;gap:6px}
.count b{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--rule);border-radius:var(--r-m);padding:10px 12px;background:var(--sheet)}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.2}
.kpi span{font-size:12px;color:var(--ink-3)}
/* ---------- question */
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.q-stem{font-family:var(--f-read);font-size:18px;line-height:2;white-space:pre-line;margin:6px 0 4px}
.q-stem mark{background:linear-gradient(transparent 12%,var(--hl) 12% 88%,transparent 88%);color:var(--hl-ink);padding-inline:2px;border-radius:2px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:11px 12px;border-radius:12px;border:1.5px solid var(--rule);background:var(--sheet);font-family:var(--f-read);font-size:16.5px;line-height:1.8}
.opt:hover{border-color:var(--rule-2)}
.opt .bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:14px;color:var(--ink-2);margin-top:2px;transition:background .15s}
.opt.sel{border-color:var(--bubble)}
.opt.sel .bub{background:var(--bubble);border-color:var(--bubble);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)}
.opt.wrong .bub{background:var(--pen);border-color:var(--pen);color:#fff}
.opt.locked{cursor:default}
.opt .ox{font-family:var(--f-ui);font-size:12.5px;line-height:1.6;color:var(--ink-2);margin-top:6px;grid-column:2}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conf .lab{font-size:12.5px;color:var(--ink-3)}
.fb{border-radius:var(--r-l);border:1px solid var(--rule);background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fb .verdict{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.no{color:var(--pen)}
.fb .verdict svg{width:28px;height:28px}
.fb h4{margin:0;font-size:13px;font-weight:700;color:var(--ink-3)}
.fb .read{font-size:16px}
.whynot{display:flex;flex-direction:column;gap:8px}
.whynot div{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:14px;line-height:1.75}
.whynot .l{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.whynot .mine{background:var(--pen-soft);border-radius:8px;padding:6px}
.flaw{border-inline-start:3px solid var(--pen);padding-inline-start:10px;font-size:14px}
.causes{display:flex;flex-wrap:wrap;gap:6px}
/* answer-sheet grid */
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.omr button{all:unset;cursor:pointer;height:38px;border-radius:50%;border:1.5px solid var(--rule-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2);position:relative}
.omr button.a{background:var(--bubble);border-color:var(--bubble);color:var(--paper)}
.omr button.cur{outline:2px solid var(--accent);outline-offset:2px}
.omr button.f::after{content:"";position:absolute;top:-2px;inset-inline-end:-2px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--paper)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--pen)}
.prog{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent);transition:width .25s}
/* ---------- lesson */
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule-2)}
.dots i.on{background:var(--accent)} .dots i.done{background:var(--bubble)}
.goal{border-radius:var(--r-m);background:var(--accent-soft);color:var(--ink);padding:14px 16px;font-weight:600}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.term{border:1px solid var(--rule);border-radius:var(--r-m);padding:10px 12px;background:var(--sheet)}
.term b{display:block;color:var(--accent);font-size:14px}
.term span{font-size:13.5px;color:var(--ink-2)}
.wsteps{display:flex;flex-direction:column;gap:8px;counter-reset:w}
.wsteps li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.wsteps li::before{counter-increment:w;content:counter(w,arabic-indic);width:26px;height:26px;border-radius:50%;background:var(--sheet-2);border:1px solid var(--rule-2);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.ans{border-radius:var(--r-m);border:1.5px solid var(--ok);background:var(--ok-soft);padding:10px 14px;font-weight:700}
.reveal{border:1.5px dashed var(--rule-2);border-radius:var(--r-m);padding:12px 14px}
.confu li{margin-bottom:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-m)}
table.tbl{border-collapse:collapse;width:100%;min-width:480px;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:start;vertical-align:top}
.tbl th{background:var(--sheet-2);font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c{text-align:center}
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-l);border:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:18px;background:var(--sheet)}
.flip .fb2{transform:rotateY(180deg);background:var(--accent-soft)}
.flip .fa b,.flip .fb2 b{font-size:16.5px;line-height:1.8}
/* ==== render v2 ==== */
/* Teaching figures (diagramHTML), explain paragraphs (explainHTML) and comparisons (compareHTML).
   Colour encodes meaning and comes from tokens only: --k1…--k6 = identity (branch, item, column, role) in a
   fixed order; the inline --c ramp (teal → indigo, color-mix of tokens) = order. Phone first: wide layouts
   switch on the figure's own width (container queries). RTL: sequences start on the right. */
.dg,.cmp{--k1:var(--accent);--k2:var(--teal);--k3:var(--d1);--k4:var(--due);--k5:var(--ok);--k6:var(--pen)}
.dg{margin:0;container-type:inline-size;display:flex;flex-direction:column;gap:14px;min-width:0;padding:16px 14px;border:1px solid var(--rule);border-radius:var(--r-l);background:var(--sheet);color:var(--ink);font-family:var(--f-ui);line-height:1.6;overflow-wrap:break-word}
:where(.dg) :where(ol,ul,dl,dd){margin:0;padding:0;list-style:none}
.dg b{font-weight:700}
.dg-title{margin:0;display:flex;align-items:flex-start;gap:8px;font-size:14.5px;font-weight:700;line-height:1.55;text-wrap:balance}
.dg-title svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--accent)}
.dg-cap{margin:0;padding-top:10px;border-top:1px dashed var(--rule-2);font-size:12.5px;line-height:1.75;color:var(--ink-2)}
@media (min-width:640px){.dg{padding:18px 20px}}
/* flow: numbered nodes joined by arrows (down on phones, right → left on wide figures with ≤ 5 steps) */
.fl{display:flex;flex-direction:column}
.fl-s{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:12px;padding-bottom:20px}
.fl-s:last-child{padding-bottom:0}
.fl-k{position:relative;z-index:1;width:32px;height:32px;margin-top:4px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-accent);font-size:14.5px;font-weight:700;line-height:1;box-shadow:0 0 0 3px var(--sheet)}
.fl-s:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:40px;bottom:10px;width:2px;border-radius:1px;background:linear-gradient(var(--c),var(--cn))}
.fl-s:not(:last-child)::after{content:"";position:absolute;inset-inline-start:11px;bottom:3px;border:5px solid transparent;border-top:7px solid var(--cn);border-bottom:0}
.fl-b{min-width:0;padding:7px 12px 9px;border-radius:var(--r-m);background:color-mix(in oklab,var(--c) 7%,var(--sheet));border:1px solid color-mix(in oklab,var(--c) 24%,var(--rule))}
.fl-t{display:block;font-size:14.5px;line-height:1.5}
.fl-d{display:block;margin-top:2px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
@container (min-width:600px){
  .fl-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);column-gap:14px}
  .fl-row .fl-s{grid-template-columns:none;grid-template-rows:auto 1fr;row-gap:10px;justify-items:center;padding-bottom:0}
  .fl-row .fl-k{margin-top:0}
  .fl-row .fl-b{width:100%;text-align:center}
  .fl-row .fl-s:not(:last-child)::before{top:15px;bottom:auto;inset-inline-start:calc(50% + 21px);width:calc(100% - 35px);height:2px;background:linear-gradient(to left,var(--c),var(--cn))}
  .fl-row .fl-s:not(:last-child)::after{top:11px;bottom:auto;inset-inline-start:calc(150% - 14px);border:5px solid transparent;border-right:7px solid var(--cn);border-left:0}
  .fl:not(.fl-row) .fl-b{display:grid;grid-template-columns:minmax(0,30%) minmax(0,1fr);column-gap:18px;align-items:baseline}
  .fl:not(.fl-row) .fl-d{margin-top:0}
}
/* stages: blocks with a tag; chevrons give the direction (down on phones, right → left in rows on wide figures) */
.sg{display:grid;gap:26px}
.sg-i{position:relative;min-width:0;display:flex;flex-direction:column;border-radius:var(--r-m);background:var(--sheet);border:1px solid color-mix(in oklab,var(--c) 32%,var(--rule))}
.sg-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 12px;border-radius:calc(var(--r-m) - 1px) calc(var(--r-m) - 1px) 0 0;background:color-mix(in oklab,var(--c) 13%,var(--sheet))}
.sg-k{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-accent);font-size:12.5px;font-weight:700;line-height:1}
.sg-name{flex:1 1 7em;min-width:0;font-size:15px;line-height:1.45}
.sg-tag{flex:none;max-width:100%;padding:1px 10px;border-radius:999px;background:var(--sheet);border:1px solid color-mix(in oklab,var(--c) 45%,var(--rule));color:color-mix(in oklab,var(--c) 65%,var(--ink));font-size:12px;font-weight:700;line-height:1.75}
.sg-pts{display:flex;flex-direction:column;gap:3px;padding:9px 12px 11px;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.sg-pts li{position:relative;padding-inline-start:14px}
.sg-pts li::before{content:"";position:absolute;inset-inline-start:2px;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.sg-a{position:absolute;top:calc(100% + 5px);inset-inline-start:calc(50% - 6px);width:11px;height:11px;border-right:2.5px solid var(--c);border-bottom:2.5px solid var(--c);transform:rotate(45deg)}
@container (min-width:600px){
  .sg{grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:auto 1fr;column-gap:28px;row-gap:18px}
  .sg-i{grid-row:span 2;display:grid;grid-template-rows:subgrid;row-gap:0}
  .sg-h{flex-direction:column;justify-content:center;gap:5px;text-align:center}
  .sg-name{flex:none}
  .sg-a{top:14px;inset-inline-start:auto;inset-inline-end:-20px;transform:rotate(135deg)}
  .sg-i.row-end .sg-a{display:none}
}
/* pyramid: centred bands, bottom widest; descriptions in a key (phones) or beside each band (wide) */
.py{display:flex;flex-direction:column;gap:14px}
.py-stack{display:grid;grid-auto-rows:1fr;gap:3px}
.py-band{position:relative;display:flex;justify-content:center;min-width:0}
.py-sh{width:var(--w);min-height:42px;display:flex;align-items:center;justify-content:center;padding:7px calc(var(--pi) * .6 + 5px);text-align:center;clip-path:polygon(var(--in) 0,calc(100% - var(--in)) 0,100% 100%,0 100%);background:color-mix(in oklab,var(--c) 40%,var(--sheet));font-size:14px;line-height:1.4}
.py-key{display:flex;flex-direction:column;gap:8px}
.py-k{position:relative;display:flex;flex-direction:column;padding-inline-start:20px;font-size:13.5px;line-height:1.65}
.py-k::before{content:"";position:absolute;inset-inline-start:0;top:.4em;width:11px;height:11px;border-radius:3px;background:color-mix(in oklab,var(--c) 40%,var(--sheet));border:1.5px solid var(--c)}
.py-k b{font-size:14px}
.py-k span{color:var(--ink-2)}
@container (min-width:560px){
  .py{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-auto-rows:1fr;column-gap:20px;row-gap:3px}
  .py-stack,.py-key{grid-row:1 / span var(--n);display:grid;grid-template-rows:subgrid;gap:3px}
  .py-stack{grid-column:1}
  .py-key{grid-column:2}
  .py-k{align-self:center}
  .py-k b{display:none}
  .py-k::before{top:.45em}
  .py-band::after{content:"";position:absolute;top:50%;inset-inline-end:-16px;width:calc((100% - var(--w)) / 2 + 8px);border-top:1.5px dotted var(--ink-3)}
}
/* cycle: steps on a closed track with arrows; the last arrow returns to step 1 */
.cy{--cg:30px;--rg:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--cg);row-gap:var(--rg);direction:rtl}
.cy-s{grid-row:var(--nr);grid-column:var(--nc);position:relative;min-width:0;display:flex;flex-direction:column;gap:3px;padding:10px 11px 11px;border-radius:var(--r-m);background:color-mix(in oklab,var(--c) 8%,var(--sheet));border:1.5px solid color-mix(in oklab,var(--c) 42%,var(--rule))}
.cy-h{display:flex;align-items:flex-start;gap:7px}
.cy-k{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-accent);font-size:12.5px;font-weight:700;line-height:1}
.cy-t{min-width:0;padding-top:1px;font-size:14px;line-height:1.5}
.cy-d{font-size:13px;line-height:1.65;color:var(--ink-2)}
.cy-a{position:absolute;color:var(--c);pointer-events:none}
.cy-a::before{content:"";position:absolute;background:currentColor;border-radius:1px}
.cy-a::after{content:"";position:absolute;border:5px solid transparent}
.cy-aw{display:none}
.a-down,.a-up,.a-upl{left:calc(50% - 6px);width:12px;height:var(--rg)}
.a-down{top:100%}
.a-up,.a-upl{bottom:100%}
.a-upl{left:calc((100% - var(--cg)) / 4 - 6px)}
.a-down::before,.a-up::before,.a-upl::before{left:5px;width:2px}
.a-down::before{top:3px;bottom:9px}
.a-down::after{left:1px;bottom:3px;border-top:7px solid currentColor;border-bottom:0}
.a-up::before,.a-upl::before{top:9px;bottom:3px}
.a-up::after,.a-upl::after{left:1px;top:3px;border-bottom:7px solid currentColor;border-top:0}
.a-left,.a-right,.a-rightb{top:calc(50% - 6px);width:var(--cg);height:12px}
.a-left{right:100%}
.a-right,.a-rightb{left:100%}
.a-rightb{top:calc(100% - (100% - var(--rg)) / 4 - 6px)}
.a-left::before,.a-right::before,.a-rightb::before{top:5px;height:2px}
.a-left::before{left:9px;right:3px}
.a-left::after{top:1px;left:3px;border-right:7px solid currentColor;border-left:0}
.a-right::before,.a-rightb::before{left:3px;right:9px}
.a-right::after,.a-rightb::after{top:1px;right:3px;border-left:7px solid currentColor;border-right:0}
.cy-loop{margin:0;display:flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.cy-loop svg{flex:none;width:16px;height:16px;color:var(--accent)}
@container (min-width:600px){
  .cy{--cg:34px;--rg:30px;grid-template-columns:repeat(var(--wcols),minmax(0,1fr))}
  .cy-s{grid-row:var(--wr);grid-column:var(--wc)}
  .cy-s.turn{justify-content:center}
  .cy-an{display:none}
  .cy-aw{display:block}
}
/* mind map: centre, then branches (colour per branch, leaves inherit it); tree on phones, around the centre on wide figures */
.mm{display:flex;flex-direction:column;gap:12px}
.mm-c{position:relative;margin:0;padding:12px 16px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:16.5px;font-weight:700;line-height:1.55;text-align:center;text-wrap:balance;box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 16%,transparent)}
.mm-side{display:contents}
.mm-b{position:relative;min-width:0;margin-inline-start:30px;padding:9px 11px 10px;border-radius:var(--r-m);background:var(--sheet);border:1px solid color-mix(in oklab,var(--c) 34%,var(--rule));border-inline-start:4px solid var(--c)}
.mm-bt{display:block;font-size:14.5px;line-height:1.5}
.dg .mm-lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mm-lv li{max-width:100%;padding:2px 10px;border-radius:10px;background:color-mix(in oklab,var(--c) 11%,var(--sheet));border:1px solid color-mix(in oklab,var(--c) 26%,var(--rule));font-size:13px;line-height:1.6}
.mm-b::before{content:"";position:absolute;inset-inline-start:-20px;top:-13px;bottom:-1px;width:2px;background:var(--rule-2)}
.mm-b.last::before{bottom:auto;height:34px}
.mm-b::after{content:"";position:absolute;inset-inline-start:-18px;top:20px;width:14px;height:2px;background:var(--rule-2)}
@container (min-width:600px){
  .mm{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.72fr) minmax(0,1fr);column-gap:36px;align-items:center}
  .mm-c{grid-column:2;grid-row:1}
  .mm-side{display:flex;flex-direction:column;justify-content:center;gap:12px;grid-row:1}
  .mm-r{grid-column:1}
  .mm-l{grid-column:3}
  .mm-b{margin-inline-start:0}
  .mm-b::before,.mm-b.last::before{top:-7px;bottom:-7px;height:auto}
  .mm-b.g-first::before{top:calc(50% - 1px)}
  .mm-b.g-last::before{bottom:calc(50% - 1px)}
  .mm-b.g-first.g-last::before{display:none}
  .mm-b::after{top:calc(50% - 1px);width:18px}
  .mm-r .mm-b{border-inline-start:1px solid color-mix(in oklab,var(--c) 34%,var(--rule));border-inline-end:4px solid var(--c)}
  .mm-r .mm-b::before{inset-inline-start:auto;inset-inline-end:-20px}
  .mm-r .mm-b::after{inset-inline-start:auto;inset-inline-end:-19px}
  .mm-l .mm-b::before{inset-inline-start:-20px}
  .mm-l .mm-b::after{inset-inline-start:-19px}
  .mm-c::before,.mm-c::after{content:"";position:absolute;top:calc(50% - 1px);width:19px;height:2px;background:var(--rule-2)}
  .mm-c::before{inset-inline-start:-19px}
  .mm-c::after{inset-inline-end:-19px}
  .mm[data-n="1"] .mm-c::after{display:none}
}
/* matrix: a grid with row and column headers; three or more columns become a card per row on narrow figures */
.mx{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border:1px solid var(--rule-2);border-radius:var(--r-m);overflow:hidden;font-size:13.5px;line-height:1.6}
.mx th,.mx td{padding:9px 10px;text-align:start;vertical-align:top;border-top:1px solid var(--rule);border-inline-start:1px solid var(--rule);overflow-wrap:anywhere}
.mx tr>:first-child{border-inline-start:0}
.mx thead th{border-top:0}
.mx .mx-corner{vertical-align:bottom;background:var(--sheet-2);color:var(--ink-3);font-size:12px;font-weight:600}
.mx .mx-ch{padding-top:11px;background:color-mix(in oklab,var(--c) 15%,var(--sheet));box-shadow:inset 0 3px 0 var(--c);font-weight:700;color:var(--ink)}
.mx .mx-rh{background:var(--sheet-2);font-weight:700;color:var(--ink)}
.mx td{background:color-mix(in oklab,var(--c) 7%,var(--sheet));color:var(--ink)}
.mx-lab{display:none}
@container (max-width:519.98px){
  .mx-many,.mx-many tbody,.mx-many tr,.mx-many th,.mx-many td{display:block}
  .mx-many{border:0;border-radius:0;overflow:visible}
  .mx-many colgroup,.mx-many thead{display:none}
  .mx-many tbody{display:flex;flex-direction:column;gap:10px}
  .mx-many tr{border:1px solid var(--rule-2);border-radius:var(--r-m);overflow:hidden;background:var(--sheet)}
  .mx-many .mx-rh{border:0;padding:9px 12px;font-size:14.5px}
  .mx-many td{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:10px;border:0;border-top:1px solid var(--rule);padding:8px 12px;background:var(--sheet)}
  .mx-many .mx-lab{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .mx-many .mx-lab::before{content:"";flex:none;width:9px;height:9px;margin-top:5px;border-radius:3px;background:var(--c)}
}
/* versus: columns facing each other across a dashed axis; three items stack on narrow figures */
.vs{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:6px}
.vs[data-n="3"]{grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1fr)}
.vs-i{grid-row:1 / span 2;display:grid;grid-template-rows:subgrid;min-width:0;border-radius:var(--r-m);background:var(--sheet);border:1px solid color-mix(in oklab,var(--c) 34%,var(--rule));overflow:hidden}
.vs-h{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 10px 9px;text-align:center;background:color-mix(in oklab,var(--c) 14%,var(--sheet));border-bottom:2px solid var(--c)}
.vs-h b{font-size:15.5px;line-height:1.45}
.vs-tag{max-width:100%;padding:0 9px;border-radius:999px;background:var(--sheet);border:1px solid color-mix(in oklab,var(--c) 40%,var(--rule));color:color-mix(in oklab,var(--c) 65%,var(--ink));font-size:12px;font-weight:700;line-height:1.75}
.vs-pts{display:flex;flex-direction:column;gap:6px;padding:10px 11px 12px;font-size:13.5px;line-height:1.6}
.vs-pts li{position:relative;padding-inline-start:14px}
.vs-pts li::before{content:"";position:absolute;inset-inline-start:1px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--c)}
.vs-x{grid-row:1 / span 2;position:relative;display:flex;justify-content:center}
.vs-x::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 1px);border-left:2px dashed var(--rule-2)}
.vs-x i{position:relative;z-index:1;width:26px;height:26px;margin-top:14px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:1.5px solid var(--rule-2);color:var(--ink-3);font-style:normal}
.vs-x svg{width:15px;height:15px}
@container (max-width:559.98px){
  .vs[data-n="3"]{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .vs[data-n="3"] .vs-i{grid-row:auto;display:flex;flex-direction:column}
  .vs[data-n="3"] .vs-h{flex-direction:row;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;text-align:start}
  .vs[data-n="3"] .vs-x{grid-row:auto;height:36px;align-items:center}
  .vs[data-n="3"] .vs-x::before{top:calc(50% - 1px);bottom:auto;left:0;right:0;border-left:0;border-top:2px dashed var(--rule-2)}
  .vs[data-n="3"] .vs-x i{margin-top:0}
}
/* formula: the formula on squared paper, its symbols, a worked example ending in a highlighted result */
.fm-board{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 14px;border-radius:var(--r-m);border:1px solid var(--rule);background-color:var(--sheet-2);background-image:linear-gradient(color-mix(in oklab,var(--accent) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--accent) 8%,transparent) 1px,transparent 1px);background-size:18px 18px;background-position:center}
.fm-line{margin:0;max-width:100%;font-size:18px;font-weight:600;line-height:1.85;text-align:center;text-wrap:balance}
.fm-lab{display:block;font-size:12.5px;font-weight:700;line-height:1.5;color:var(--ink-3)}
.fm-lhs{font-weight:700;color:color-mix(in oklab,var(--accent) 85%,var(--ink))}
.dg .op{display:inline-block;margin-inline:.1em;font-weight:700;color:var(--pen)}
.dg .op-eq{font-size:1.15em}
.fm-sep{font-size:15px;font-weight:700;line-height:1;color:var(--ink-3)}
.fm-rule{width:40%;margin:4px 0;border:0;border-top:1px dashed var(--rule-2)}
.dg .fm-parts{display:grid;grid-template-columns:fit-content(45%) minmax(0,1fr);gap:8px 12px;align-items:baseline}
.fm-part{display:contents}
.fm-sym{justify-self:start;max-width:100%;padding:2px 10px;border-radius:8px;background:var(--accent-soft);color:color-mix(in oklab,var(--accent) 85%,var(--ink));font-size:14px;font-weight:700;line-height:1.6}
.fm-means{font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.fm-ex{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px dashed var(--rule-2)}
.fm-ex-h{margin:0;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.fm-ex-h svg{flex:none;width:17px;height:17px;color:var(--teal)}
.fm-given{display:flex;flex-direction:column;gap:6px}
.fm-gl{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.dg .fm-given ul{display:flex;flex-wrap:wrap;gap:6px}
.fm-given li{max-width:100%;padding:2px 10px;border-radius:12px;background:var(--sheet-2);border:1px solid var(--rule);font-size:13px;line-height:1.7}
.fm-steps{display:flex;flex-direction:column;gap:6px}
.fm-steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px;line-height:1.75}
.fm-n{width:22px;height:22px;margin-top:2px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule-2);font-size:11.5px;font-weight:700;line-height:1;color:var(--ink-2)}
.fm-res{margin:0;display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-radius:10px;background:var(--hl);color:var(--hl-ink);font-size:14.5px;font-weight:700;line-height:1.65}
.fm-res svg{flex:none;width:18px;height:18px;margin-top:3px}
.dg .fm-res .op{color:inherit}
/* bars: horizontal from the right-hand baseline, scaled to the largest value, values at the bar ends */
.br-unit{margin:0;font-size:12px;font-weight:600;color:var(--ink-3)}
.br{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr);gap:9px 10px;align-items:center}
.br-row{display:contents}
.br-l{font-size:13px;font-weight:600;line-height:1.45;color:var(--ink-2);overflow-wrap:anywhere}
.br-tr{position:relative;display:flex;align-items:center;gap:7px;min-width:0;min-height:30px}
.br-tr::before{content:"";position:absolute;inset-inline-start:0;top:-5px;bottom:-5px;width:2px;background:var(--ink-3)}
.br-b{flex:0 0 calc(var(--v) * (100% - var(--vr,3em)));min-width:3px;height:22px;margin-inline-start:2px;border-start-end-radius:5px;border-end-end-radius:5px;background:color-mix(in oklab,var(--accent) 72%,var(--sheet))}
.br-b.is-max{background:var(--accent)}
.br-v{flex:none;font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
/* ladder: a staircase of levels, lowest at the bottom; the red-pen dashed line separates low from high */
.ld{display:flex;flex-direction:column-reverse;gap:6px}
.ld-r{display:flex;align-items:center;gap:8px;width:var(--w);max-width:100%;min-width:0}
.ld-n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule-2);background:var(--sheet);color:var(--ink-3);font-size:12px;font-weight:700;line-height:1}
.ld-t{flex:1;min-width:0;padding:7px 12px;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet-2);color:var(--ink-2);font-size:14px;font-weight:700;line-height:1.5}
.ld-r.hi .ld-t{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ld-r.hi .ld-n{border-color:var(--accent);color:var(--accent)}
.ld-r.mark .ld-t{outline:2px dashed var(--pen);outline-offset:2px}
.ld-cut{display:flex;flex-direction:column;gap:4px;margin-block:4px;font-size:12px;font-weight:700;line-height:1.5}
.ld-cut span{display:flex;align-items:center;gap:6px}
.ld-cut span::before{content:"";flex:none;border:5px solid transparent}
.ld-up{padding-bottom:5px;border-bottom:2px dashed var(--pen);color:color-mix(in oklab,var(--accent) 85%,var(--ink))}
.ld-up::before{border-bottom:7px solid currentColor!important;border-top:0!important;margin-top:-2px}
.ld-dn{color:var(--ink-3)}
.ld-dn::before{border-top:7px solid currentColor!important;border-bottom:0!important}
.l2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.l2-h{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.l2 .ld-r{width:calc(30% + var(--w) * .7)}
.l2 .ld-n{display:none}
.l2 .ld-t{padding:6px 9px;font-size:13.5px}
.ld-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3)}
.ld-legend span{display:inline-flex;align-items:center;gap:6px}
.ld-legend i{width:18px;height:11px;border-radius:3px;border:1px solid var(--rule-2);background:var(--sheet-2)}
.ld-legend i.hi{background:var(--accent);border-color:var(--accent)}
.ld-legend i.mk{border:2px dashed var(--pen);background:none}
/* anatomy: a sentence cut into coloured parts, each labelled underneath */
.an{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 6px}
.an-p{display:inline-flex;flex-direction:column;gap:5px;max-width:100%;min-width:0}
.an-t{padding:3px 8px 2px;border-radius:6px 6px 0 0;background:color-mix(in oklab,var(--c) 14%,var(--sheet));border-bottom:3px solid var(--c);font-family:var(--f-read);font-size:16.5px;line-height:1.85;color:var(--ink)}
.an-l{display:flex;align-items:flex-start;gap:6px;padding-inline:3px;font-size:12px;font-weight:600;line-height:1.55;color:var(--ink-2)}
.an-l::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;border-radius:2px;background:var(--c)}
/* domains (golden lesson): head, heart, hand */
.dg-domains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dgd{border-radius:var(--r-m);padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.dgd svg{width:38px;height:38px}
.dgd b{font-family:var(--f-display);font-size:18px}
.dgd span{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.dgd em{font-style:normal;font-size:12px;line-height:1.6;border-top:1px dashed var(--rule-2);padding-top:6px;color:var(--ink-2)}
.dgd.head{background:var(--accent-soft)} .dgd.head b,.dgd.head svg{color:var(--accent)}
.dgd.heart{background:var(--pen-soft)} .dgd.heart b,.dgd.heart svg{color:var(--pen)}
.dgd.hand{background:var(--teal-soft)} .dgd.hand b,.dgd.hand svg{color:var(--teal)}
/* explain paragraphs: callouts (example / warning / rule) and lists */
.co-ex{--co:var(--teal)} .co-warn{--co:var(--pen)} .co-rule{--co:var(--accent)}
.read .co{margin:0 0 .9em;padding:10px 14px 12px;border-radius:var(--r-m);border:1px solid color-mix(in oklab,var(--co) 26%,var(--rule));border-inline-start:4px solid var(--co);background:color-mix(in oklab,var(--co) 7%,var(--sheet))}
.read .co-h{margin:0 0 2px;display:flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:13.5px;font-weight:700;line-height:1.6;color:color-mix(in oklab,var(--co) 78%,var(--ink))}
.read .co-h svg{flex:none;width:17px;height:17px}
.read .co > :last-child{margin-bottom:0}
.read .rd-ul{margin:0 0 .8em;padding-inline-start:1.25em}
.read .rd-ul li{margin-bottom:.25em;padding-inline-start:.15em}
.read .rd-ul li::marker{color:var(--accent)}
.read p + .rd-ul{margin-top:-.3em}
/* comparison: a table on wide screens, a card per row under 600px */
.cmp{display:flex;flex-direction:column;gap:10px;min-width:0}
.cmp-title{margin:0;font-size:15.5px;font-weight:700;line-height:1.5;text-wrap:balance}
.cmp-t{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border:1px solid var(--rule-2);border-radius:var(--r-m);overflow:hidden;background:var(--sheet);font-size:14px;line-height:1.65}
.cmp-t th,.cmp-t td{padding:10px 12px;text-align:start;vertical-align:top;border-top:1px solid var(--rule);border-inline-start:1px solid var(--rule);overflow-wrap:anywhere}
.cmp-t tr>:first-child{border-inline-start:0}
.cmp-t thead th{border-top:0;font-weight:700;background:color-mix(in oklab,var(--c) 12%,var(--sheet));box-shadow:inset 0 3px 0 var(--c)}
.cmp-t thead .cmp-a{background:var(--sheet-2);box-shadow:none;color:var(--ink-3);font-size:12.5px}
.cmp-t tbody th{background:var(--sheet-2);font-weight:700}
.cmp-lab{display:none}
@media (max-width:599.98px){
  .cmp-t,.cmp-t tbody,.cmp-t tr,.cmp-t th,.cmp-t td{display:block}
  .cmp-t{border:0;border-radius:0;overflow:visible;background:none}
  .cmp-t colgroup,.cmp-t thead{display:none}
  .cmp-t tbody{display:flex;flex-direction:column;gap:10px}
  .cmp-t tr{border:1px solid var(--rule-2);border-radius:var(--r-m);overflow:hidden;background:var(--sheet)}
  .cmp-t tbody th{border:0;padding:9px 12px;font-size:15px}
  .cmp-t td{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:10px;border:0;border-top:1px solid var(--rule);padding:9px 12px}
  .cmp-lab{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;font-weight:700;line-height:1.6;color:var(--ink-2)}
  .cmp-lab::before{content:"";flex:none;width:9px;height:9px;margin-top:6px;border-radius:3px;background:var(--c)}
}
@media print{
  .dg,.read .co,.cmp-t tr,.sg-i,.cy-s,.vs-i,.mm-b{break-inside:avoid}
  .dg,.dg *,.read .co,.cmp,.cmp *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ==== /render v2 ==== */
/* ==== guided lesson (الشرح الموجّه) ==== */
.gd-head{display:flex;flex-direction:column;gap:6px}
.gd-prog{height:8px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.gd-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:999px;transition:width .35s ease}
.gd-card{border:1px solid var(--rule);border-radius:var(--r-l);background:var(--sheet);padding:16px 14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gd-scene{border-radius:var(--r-m);border:1px solid color-mix(in oklab,var(--d1,var(--accent)) 30%,var(--rule));border-inline-start:4px solid var(--d1,var(--accent));background:color-mix(in oklab,var(--d1,var(--accent)) 6%,var(--sheet));padding:12px 14px}
.gd-scene .read{font-size:17px;line-height:2}
.gd-scene-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.gd-scene-h svg{width:16px;height:16px;color:var(--d1,var(--accent))}
.gd-q{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--warn-soft);border:1px solid color-mix(in oklab,var(--warn) 35%,transparent);font-size:15.5px;line-height:1.8}
.gd-q svg{width:20px;height:20px;flex:none;color:var(--warn);margin-top:4px}
.gd-bridge{border-inline-start:3px solid var(--teal);padding:4px 12px;background:color-mix(in oklab,var(--teal) 6%,var(--sheet));border-radius:var(--r-m)}
.gd-bridge .read{font-size:16.5px}
.gd-scene-line{margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.gd-scene-line svg{width:15px;height:15px;flex:none;margin-top:4px}
.gd-takeaway{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-m);background:var(--ok-soft);border:1px solid color-mix(in oklab,var(--ok) 35%,transparent);line-height:1.8}
.gd-takeaway svg{width:20px;height:20px;flex:none;color:var(--ok);margin-top:4px}
.gd-nav{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:calc(var(--nav-h,64px) + 8px);padding:8px 0;background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:4}
.gd-nav .btn{min-width:120px;justify-content:center}
.gd-next{border:1.5px solid color-mix(in oklab,var(--accent) 35%,var(--rule));background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 7%,var(--sheet)),var(--sheet))}
.gd-next .t{font-size:16.5px}
.gd-ic{display:inline-flex;flex:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin-top:2px}
.gd-ic svg{width:19px;height:19px}
.gd-grp summary{list-style:none;cursor:pointer;user-select:none} .gd-grp summary::-webkit-details-marker{display:none}
.gd-grp .sec-h{margin:0;padding:6px 0;align-items:center}
.gd-tog{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);background:var(--sheet)}
.gd-tog svg{width:16px;height:16px;transform:rotate(90deg);transition:transform .2s}
.gd-grp[open] .gd-tog svg{transform:rotate(-90deg)}
.gd-grp > .list{margin-top:8px}
.gd-li .s.row{margin-top:4px}
/* ==== المقرر (course): units, chapter cards, step checks, lesson bank, gate ==== */
.cs-next{border-color:color-mix(in oklab,var(--accent) 35%,var(--rule));background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 8%,var(--sheet)),var(--sheet))}
.cs-un{display:inline-flex;flex:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:16px}
.cs-un svg{width:18px;height:18px}
.cs-unit.done .cs-un{background:var(--ok-soft);color:var(--ok)}
.cs-thread{margin:6px 0 2px;border-inline-start:3px solid var(--accent);padding:6px 12px;background:color-mix(in oklab,var(--accent) 5%,var(--sheet));border-radius:var(--r-m);line-height:1.9}
.cs-locked{opacity:.72}
.cs .h1{font-size:clamp(21px,5vw,27px)}
.cs-text{font-size:18px;line-height:2.05}
.cs-ideamap{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.cs-ideamap li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--sheet)}
.cs-ideamap li .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.cs-stepdots{display:flex;gap:6px;align-items:center;margin:2px 0}
.cs-stepdots i{display:block;width:12px;height:12px;border-radius:999px;border:1.5px solid var(--rule-2);background:var(--sheet)}
.cs-stepdots i.c{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cs-stepdots i.ok{border-color:var(--ok);background:var(--ok)} .cs-stepdots i.no{border-color:var(--pen);background:var(--pen)}
.cs-check{border:1.5px dashed color-mix(in oklab,var(--accent) 45%,var(--rule));border-radius:var(--r-l);padding:14px;background:color-mix(in oklab,var(--accent) 3%,var(--sheet))}
.cs-check-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent)}
.cs-check-h svg{width:18px;height:18px}
.cs-check .opts{margin-top:6px}
.cs-why{border-radius:var(--r-m);padding:12px 14px;border:1.5px solid var(--ok);background:var(--ok-soft);display:flex;flex-direction:column;gap:8px;animation:csPop .3s ease}
.cs-why.no{border-color:var(--pen);background:var(--pen-soft)}
.cs-why .verdict{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:18px}
.cs-why .verdict.ok{color:var(--ok)} .cs-why .verdict.no{color:var(--pen)}
.cs-why .verdict svg{width:24px;height:24px}
.cs-why .ans{background:var(--sheet)}
@keyframes csPop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.cs-box{border-radius:var(--r-m);border:1px solid var(--rule);padding:12px 14px;background:var(--sheet)}
.cs-box-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px;font-size:14px}
.cs-box-h svg{width:18px;height:18px}
.cs-box.teal{border-color:color-mix(in oklab,var(--teal) 40%,var(--rule));background:color-mix(in oklab,var(--teal) 6%,var(--sheet))} .cs-box.teal .cs-box-h{color:var(--teal)}
.cs-box.pen{border-color:color-mix(in oklab,var(--pen) 40%,var(--rule));background:color-mix(in oklab,var(--pen) 5%,var(--sheet))} .cs-box.pen .cs-box-h{color:var(--pen)}
.cs-detail > summary .tiny{margin-inline-start:auto}
.cs-bank-top{display:flex;flex-direction:column;gap:8px}
.cs-bank-idea{border:1px solid var(--rule);border-radius:var(--r-m);padding:10px 12px;background:var(--sheet);display:flex;flex-direction:column;gap:8px}
.cs-bank-bar{height:6px}
.cs-pass{border-color:color-mix(in oklab,var(--ok) 45%,var(--rule));background:linear-gradient(135deg,color-mix(in oklab,var(--ok) 9%,var(--sheet)),var(--sheet))}
.cs-fail{border-color:color-mix(in oklab,var(--warn) 45%,var(--rule));background:linear-gradient(135deg,color-mix(in oklab,var(--warn) 9%,var(--sheet)),var(--sheet))}
.cs-home .btns{margin-top:2px}
.cs-next .eyebrow svg,.cs-pass .eyebrow svg,.cs-fail .eyebrow svg,.cs .eyebrow svg,.cs .goal svg,.cs .small svg{width:16px;height:16px;vertical-align:-3px}
.cs-check-h{flex-wrap:wrap} .cs-check-h .tiny{flex-basis:100%;font-weight:400}
.cs-cta{align-items:center}
.cs-res{margin:0}
.cs-cov{border:1px solid var(--rule);border-radius:var(--r-m);padding:10px 12px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.cs-lchip{text-align:start;max-width:100%;white-space:normal;line-height:1.5} .cs-lchip .faint{margin-inline-start:6px;font-size:11px}
.cs-unit.cur > summary{background:color-mix(in oklab,var(--accent) 6%,var(--sheet));border-radius:var(--r-m)}
/* ==== strategies (طرق الحل الذهنية) ==== */
.strat-ic svg{width:22px;height:22px;flex:none}
.strat-dom .h2 svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:4px;color:var(--accent)}
.strat-li .s{color:var(--ink-3)}
.strat-g{margin:12px 0 4px}
.strat-steps{margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:ss}
.strat-steps li{list-style:none;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;font-family:var(--f-read);font-size:16.5px;line-height:1.85}
.strat-steps li::before{counter-increment:ss;content:counter(ss,arabic-indic);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-ui);font-size:14px;font-weight:700;margin-top:4px}
.wsteps-l{margin:4px 0;padding-inline-start:0;display:flex;flex-direction:column;gap:6px;counter-reset:wl}
.wsteps-l li{list-style:none;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-family:var(--f-read);font-size:16px;line-height:1.85}
.wsteps-l li::before{counter-increment:wl;content:counter(wl,arabic-indic);width:24px;height:24px;border-radius:50%;background:var(--sheet-2);border:1px solid var(--rule-2);display:grid;place-items:center;font-family:var(--f-ui);font-size:12px;font-weight:700;margin-top:5px}
.strat-co .co{margin-bottom:12px}
.strat-co .co ul{margin:4px 0 0;padding-inline-start:1.2em}
.strat-co .co li{margin-bottom:.3em}
.dm{border:1.5px solid color-mix(in oklab,var(--accent) 35%,var(--rule));border-radius:var(--r-l);background:color-mix(in oklab,var(--accent) 4%,var(--sheet));padding:14px;display:flex;flex-direction:column;gap:10px}
.dm-h{display:flex;align-items:center;gap:8px;font-size:16px}
.dm-h svg{width:20px;height:20px;color:var(--accent);flex:none}
.dm-in{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.dm-f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.dm-f input,.dm-f select{font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--rule-2);border-radius:10px;background:var(--sheet);color:var(--ink);min-width:110px;width:120px}
.dm-f input:focus,.dm-f select:focus{outline:2px solid var(--accent);outline-offset:1px}
.dm-steps{margin:0;padding-inline-start:1.3em;list-style:arabic-indic;display:flex;flex-direction:column;gap:6px;font-family:var(--f-read);font-size:16px;line-height:1.8}
.dm-steps li::marker{color:var(--accent);font-weight:700}
.dm-direct{padding-top:8px;border-top:1px dashed var(--rule-2)}
.dm-v{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-m);font-weight:600;font-size:14.5px}
.dm-v svg{width:20px;height:20px;flex:none}
.dm-v.ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in oklab,var(--ok) 40%,transparent)}
.dm-v.warn{background:var(--warn-soft,var(--sheet-2));color:var(--warn);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent)}
.tr-crumbs{margin:0;padding:0 0 0 0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;list-style:none}
.tr-crumbs li{padding:6px 10px;border-radius:8px;background:var(--sheet-2)}
.tr-q .read{font-size:17px}
.tr-opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tr-opts .btn{justify-content:flex-start;text-align:start;white-space:normal;line-height:1.6;padding:10px 14px}
.tr-leaf{border-radius:var(--r-m);border:1.5px solid var(--ok);background:var(--ok-soft);padding:10px 14px}
.tr-leaf .co-h{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-weight:700;color:var(--ok)}
.tr-leaf .co-h svg{width:18px;height:18px}
.tr-leaf .read{font-size:16.5px}
.mental{border-radius:var(--r-m);border:1px solid color-mix(in oklab,var(--accent) 30%,var(--rule));background:color-mix(in oklab,var(--accent) 5%,var(--sheet));padding:10px 14px}
.mental h4{display:flex;align-items:center;gap:6px;color:var(--accent)}
.mental h4 svg{width:18px;height:18px}
.mental-steps{margin:0;padding-inline-start:1.3em;list-style:arabic-indic;font-family:var(--f-read);font-size:16px;line-height:1.85;display:flex;flex-direction:column;gap:4px}

.rf-facts{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

.rf-chips{display:flex;flex-wrap:wrap;gap:6px}

/* ==== /ref ==== */
/* ==== views v2 ==== */
.isteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;margin-top:6px}
.isteps button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 0 4px;color:var(--ink-3);font:600 11.5px/1.25 var(--f-ui);cursor:pointer;border-radius:var(--r-s);min-height:48px}
.isteps button i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sheet-2);border:1.5px solid var(--rule-2);font-style:normal;font-size:12px;color:var(--ink-2)}
.isteps button i svg{width:14px;height:14px}
.isteps button.done i{background:var(--bubble);border-color:var(--bubble);color:var(--paper)}
.isteps button.on{color:var(--accent)}
.isteps button.on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 3px var(--accent-soft)}
.isteps button:disabled{opacity:.45;cursor:not-allowed}
.isteps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.freq{color:var(--teal);background:var(--teal-soft);border-color:transparent;white-space:normal}
.keyrow{align-items:flex-start}
.keyrow > .chip{margin-top:2px}
.keyrow .t{font-family:var(--f-read);font-weight:700}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:start}
.xref{display:inline;text-decoration-style:dotted;font-weight:600}
details.kx{border:1px solid var(--rule);border-radius:var(--r-m);background:var(--sheet);margin-bottom:8px}
details.kx > summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:10px;min-height:48px}
details.kx > summary > b{flex:1;min-width:0}
details.kx > summary::-webkit-details-marker{display:none}
details.kx > summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s;flex:none;margin-top:-5px}
details.kx[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
details.kx > p{margin:0 14px 10px}
details.kx > .list{margin:0 14px 6px}
.er-ref{flex:0 0 7.5em;line-height:1.5}
ol.path{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.path .lesson-row{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px}
ol.path .pn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.bp{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.bp-r{display:grid;gap:4px}
.bp-n{font-size:13px;font-weight:600}
.bp-b{display:grid;gap:3px}
.bp-w,.bp-f{display:flex;align-items:center;justify-content:flex-end;height:18px;border-radius:4px;min-width:38px;padding-inline:6px;font-size:11.5px;color:var(--on-accent);box-sizing:border-box}
.bp-w{background:var(--accent)} .bp-f{background:var(--teal)}
@media (max-width:420px){.isteps button span{font-size:10.5px}}
.goal svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:2px;flex:none}
.spec .li{align-items:flex-start}
.spec .li .v{font-size:13.5px;margin-top:2px;color:var(--ink)}
/* ==== /views v2 ==== */
/* ==== engage ==== */
/* Motivation layer (08_engage.js): header strip, quick-challenge cards, badges drawn as teacher's stamps, session flow,
   celebration banner + confetti, the minute sprint, term matching, daily cards and the journey map.
   Colours come from tokens; --gold (proven mastery, records) and --flame (streak) are the only new hues, light + dark. */
:root{--gold:#B07A0C;--gold-2:#F3C85A;--gold-soft:#FBF1D6;--on-gold:#2E2000;--flame:#D2552C;--flame-soft:#FDE6DB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#E8BB4E;--gold-2:#8C6810;--gold-soft:#2D2510;--on-gold:#1A1200;--flame:#FF9466;--flame-soft:#3B2219}}
:root[data-theme="dark"]{--gold:#E8BB4E;--gold-2:#8C6810;--gold-soft:#2D2510;--on-gold:#1A1200;--flame:#FF9466;--flame-soft:#3B2219}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* motion: view entrance (≤200ms per block), pressed state */
#view.eng-enter > .stack-l > *,#view.eng-enter > .stack > *{animation:engIn .18s cubic-bezier(.2,.7,.2,1) both}
#view.eng-enter > .stack-l > :nth-child(2){animation-delay:.025s}
#view.eng-enter > .stack-l > :nth-child(3){animation-delay:.05s}
#view.eng-enter > .stack-l > :nth-child(4){animation-delay:.075s}
#view.eng-enter > .stack-l > :nth-child(n+5){animation-delay:.1s}
@keyframes engIn{from{opacity:0;transform:translateY(8px)}}
@keyframes engPop{from{transform:scale(.4);opacity:0}}
@keyframes engPop2{50%{transform:scale(1.05)}}
@keyframes engShake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes engRing{from{stroke-dashoffset:var(--full)}}
.btn,.chip.tog,.opt,.ecc,.es-cell,.jr-l,.mt-i{transition:transform .08s ease-out}
.btn:active:not([disabled]),.chip.tog:active,.ecc:active,.es-cell:active,.mt-i:active:not(.ok){transform:scale(.97)}
.opt:active:not(.locked){transform:scale(.99)}
/* progress ring */
.eng-ring-w{position:relative;display:inline-grid;place-items:center;flex:none}
.eng-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.eng-ring .trk{fill:none;stroke:var(--rule)}
.eng-ring .val{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .12s linear,stroke .2s}
#view.eng-enter .eng-ring-w.anim .val{animation:engRing .7s cubic-bezier(.2,.7,.2,1) both}
.eng-ring-in{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.eng-ring-in b{font-family:var(--f-display);font-size:19px;line-height:1.1}
.eng-ring-in small{font-size:10px;font-weight:600;color:var(--ink-3);margin-top:2px}
.eng-ring-in svg{width:26px;height:26px;color:var(--ok)}
/* home strip: streak · level · daily goal */
.eng-strip{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.75fr) minmax(0,.85fr);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-l);box-shadow:var(--shadow)}
.es-cell{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:100px;padding:12px 6px;text-align:center;border-radius:var(--r-l)}
.es-cell + .es-cell::before{content:"";position:absolute;inset-inline-start:0;top:16px;bottom:16px;border-inline-start:1px dashed var(--rule-2)}
.es-cell:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.es-l{font-size:11.5px;font-weight:600;line-height:1.35;color:var(--ink-3);text-wrap:balance}
.es-flame{display:grid;place-items:center;color:var(--rule-2)}
.es-flame svg{width:28px;height:28px}
.es-streak.on .es-flame,.es-streak.pending .es-flame{color:var(--flame)}
.es-streak.on .es-flame svg{fill:var(--flame-soft)}
.es-streak.pending .es-l{color:var(--flame)}
.es-num{font-family:var(--f-display);font-size:27px;line-height:1;color:var(--ink)}
.es-level{flex-direction:row;justify-content:flex-start;gap:9px;padding-inline:10px;text-align:start}
.es-seal{flex:none;position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 3px var(--accent-soft)}
.es-seal::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.3px dashed color-mix(in srgb,var(--on-accent) 60%,transparent)}
.es-seal b{font-family:var(--f-display);font-size:19px;line-height:1}
.es-seal.big{width:56px;height:56px}
.es-seal.big b{font-size:25px}
.es-lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.es-lv{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px}
.es-lv b{font-size:15.5px;line-height:1.3}
.es-plus{font-size:11px;font-weight:700;line-height:1.3;color:var(--ok)}
.es-bar{display:block;height:7px;border-radius:4px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.es-bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.es-level .es-l{text-wrap:wrap}
.es-goal.done .eng-ring .val{stroke:var(--ok)}
.eng-honest{display:flex;align-items:center;gap:6px;margin:-12px 4px 0}
.eng-honest svg{flex:none;width:14px;height:14px}
@media (max-width:370px){.es-level{flex-direction:column;align-items:center;text-align:center}.es-lv{justify-content:center}.es-seal{width:38px;height:38px}}
/* quick challenges: a scroll-snap row on phones, three columns from 600px */
.eng-chal{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,46%);gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scroll-padding-inline:16px;scrollbar-width:none}
.eng-chal::-webkit-scrollbar{display:none}
@media (min-width:600px){.eng-chal{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));margin-inline:0;padding-inline:0;overflow:visible}}
.ecc{all:unset;box-sizing:border-box;cursor:pointer;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:6px;min-height:156px;padding:14px 14px 12px;border-radius:var(--r-l);background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);overflow:hidden;--c:var(--accent);--cs:var(--accent-soft)}
.ecc.c-sprint{--c:var(--pen);--cs:var(--pen-soft)}
.ecc.c-match{--c:var(--teal);--cs:var(--teal-soft)}
.ecc.c-cards{--c:var(--due);--cs:var(--due-soft)}
.ecc::after{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:86px;height:86px;border-radius:50%;background:var(--cs);opacity:.7;pointer-events:none}
.ecc > *{position:relative;z-index:1}
.ecc:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.ecc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.ecc-ic svg{width:22px;height:22px}
.ecc-t{font-size:15.5px;line-height:1.35}
.ecc-d{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.ecc-m{margin-top:auto;padding-top:4px;font-size:11.5px;font-weight:700;color:color-mix(in srgb,var(--c) 85%,var(--ink))}
/* badges: stamp emblems; locked ones greyed with their condition */
.eb-em{--bc:var(--accent);--bs:var(--accent-soft);position:relative;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--bs);color:var(--bc);border:2px solid var(--bc)}
.eb-em::after{content:"";position:absolute;inset:3.5px;border-radius:50%;border:1.3px dashed currentColor;opacity:.5}
.eb-em svg{width:24px;height:24px}
.eb-em.t1{--bc:var(--teal);--bs:var(--teal-soft)}
.eb-em.t3{--bc:var(--gold);--bs:var(--gold-soft)}
.eb-em.locked{--bc:var(--rule-2);--bs:var(--sheet-2);color:var(--ink-3)}
.eb-em.locked svg{opacity:.5}
.eb-em.sm{width:40px;height:40px}
.eb-em.sm svg{width:19px;height:19px}
.eb-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.eb-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.eb{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:12px 8px 11px;border-radius:var(--r-m);background:var(--sheet);border:1px solid var(--rule);text-align:center}
.eb.locked{background:transparent;border-style:dashed}
.eb-n{font-size:13px;line-height:1.4}
.eb.locked .eb-n{color:var(--ink-2)}
.eb-d{font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.eb-row .eb-d{display:none}
.eb-t{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.eb-t svg{width:12px;height:12px}
.eb-p{display:block;width:72%;height:5px;margin-top:2px;border-radius:3px;background:var(--sheet-2);border:1px solid var(--rule);overflow:hidden}
.eb-p i{display:block;height:100%;background:var(--accent)}
/* session flow */
.eng-next{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-l);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.en-h{display:flex;align-items:center;gap:10px}
.en-h .eyebrow{color:var(--accent)}
.en-dots{flex:1;display:flex;gap:4px}
.en-dots i{flex:1;max-width:34px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--accent) 20%,transparent)}
.en-dots i.d{background:var(--accent)}
.en-dots i.c{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.en-step{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.btn.en-btn{justify-content:flex-start;gap:12px;text-align:start;padding-block:11px}
.en-tx{display:flex;flex-direction:column;min-width:0}
.en-k{font-size:12.5px;font-weight:600;opacity:.85}
.en-t{font-size:16px;line-height:1.45}

.en-why{margin:0}
.eng-done{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-l);background:linear-gradient(165deg,var(--ok-soft),var(--sheet) 72%);border:1px solid color-mix(in srgb,var(--ok) 32%,transparent)}
.eng-done.inner{padding:14px}
.eng-done .small{margin:0}
.ed-h{display:flex;align-items:center;gap:12px}
.ed-h > div{flex:1;min-width:0}
.ed-ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--on-accent)}
.ed-ic svg{width:24px;height:24px}
.ed-streak{display:inline-flex;align-items:center;gap:4px;color:var(--flame)}
.ed-streak b{font-family:var(--f-display);font-size:22px;line-height:1}
.ed-streak svg{width:24px;height:24px;fill:var(--flame-soft)}
.ed-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ed-nums div{display:flex;flex-direction:column;gap:2px;padding:8px 4px;border-radius:var(--r-m);background:var(--sheet);border:1px solid var(--rule);text-align:center}
.ed-nums b{font-family:var(--f-display);font-size:20px;line-height:1.2}
.ed-nums span{font-size:11px;line-height:1.35;color:var(--ink-3)}
@media (max-width:370px){.ed-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* celebration: banner + confetti (no confetti and no motion under reduced motion) */
.eng-cel{position:fixed;z-index:65;top:calc(66px + env(safe-area-inset-top,0px));inset-inline:16px;margin-inline:auto;max-width:440px;display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:16px;background:var(--sheet);border:1px solid var(--rule);box-shadow:0 12px 32px rgba(10,14,25,.2);pointer-events:none;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.98);transition:opacity .2s,transform .2s,visibility 0s .2s}
.eng-cel.on{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s cubic-bezier(.3,1.4,.5,1)}
.ec-r{display:flex;align-items:center;gap:12px}

.ec-k{font-size:11.5px;font-weight:700;color:var(--ink-3)}

.ec-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ec-ic svg{width:21px;height:21px}
.ec-ic.ok{background:var(--ok-soft);color:var(--ok)}
.ec-ic.gold{background:var(--gold-soft);color:var(--gold)}
.ec-ic.gold svg{fill:currentColor}
.ec-seal{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:700 18px/1 var(--f-display);box-shadow:0 0 0 3px var(--accent-soft)}

.eng-confetti{position:fixed;inset:0;width:100%;height:100%;z-index:66;pointer-events:none}
/* shared challenge pieces */
.es-intro{display:flex;align-items:center;gap:16px}

.sp-ring .eng-ring-in b{font-size:26px}

  stages: sv('<rect x="14.5" y="7" width="6.5" height="10" rx="1.6"/><rect x="3" y="7" width="6.5" height="10" rx="1.6"/><path d="m12.8 10.5-1.6 1.5 1.6 1.5"/>'),
  pyramid: sv('<path d="M12 3.5 21 20H3z"/><path d="M7.6 14.2h8.8M9.9 9.4h4.2"/>'),
  cycle: I.refresh,
  mindmap: sv('<circle cx="12" cy="12" r="3.2"/><circle cx="4.5" cy="5.5" r="1.7"/><circle cx="19.5" cy="5.5" r="1.7"/><circle cx="4.5" cy="18.5" r="1.7"/><circle cx="19.5" cy="18.5" r="1.7"/><path d="m6 6.8 3.6 3.1M18 6.8l-3.6 3.1M6 17.2l3.6-3.1M18 17.2l-3.6-3.1"/>'),
  matrix: I.grid,
  versus: sv('<path d="M20 8H5.5"/><path d="m9 4.5-3.5 3.5L9 11.5"/><path d="M4 16h14.5"/><path d="m15 12.5 3.5 3.5-3.5 3.5"/>'),
  formula: sv('<path d="M3.5 9.5h7M3.5 14.5h7"/><path d="m14.5 8 6 8M20.5 8l-6 8"/>'),
  bars: sv('<path d="M20.5 3.5v17"/><path d="M20.5 7.5H9" stroke-width="3"/><path d="M20.5 12.5H4" stroke-width="3"/><path d="M20.5 17.5H12" stroke-width="3"/>'),
  ladder: sv('<path d="M21 20h-5v-5h-5v-5H6V5H3"/>'),
  ladders2: sv('<path d="M11 20H7v-4H3M21 20h-4v-4h-4v-4h-2"/>'),
  anatomy: sv('<path d="M3 17.5h7M14 17.5h7"/><path d="M4 12h5.5M14.5 12H20M6.5 6.5H17.5"/>'),
};

/* ---------- frame: title (small figure heading) + body + note (figcaption) ---------- */
function dgFrame(type, g, body, cap) {
  const id = 'dgt' + (++dgSeq);
  const title = g.title ? `<p class="dg-title" id="${id}">${DG_ICON[type] || ''}<span>${mdx(g.title)}</span></p>` : '';
  const note = g.note || cap ? `<figcaption class="dg-cap">${mdx(g.note || cap)}</figcaption>` : '';
  return `<figure class="dg dg--${type}"${g.title ? ` aria-labelledby="${id}"` : ''}>${title}${body}${note}</figure>`;
}

/* ---------- math-aware text for formulas ----------
   Formulas are Arabic words with operators, read right to left. Runs that contain Latin letters
   («1 − p», «T = 50 + 10z», «p») are isolated as LTR so they keep their written order; parentheses
   stay outside the isolate so they mirror correctly. Operators with spaces around them are styled. */
const DG_ISLAND = /[A-Za-z0-9][A-Za-z0-9 .,+\-−×÷=^²³½±/]*[A-Za-z0-9²³]|[A-Za-z]/g;
const dgOps = h => h.replace(/ ([=×÷±+−⇔]) /g, ' <span class="op">$1</span> ');
function dgMath(s) {
  const t = String(s == null ? '' : s);
  let out = '', last = 0;
  for (const m of t.matchAll(DG_ISLAND)) {
    if (!/[A-Za-z]/.test(m[0])) continue;
    out += dgOps(mdx(t.slice(last, m.index))) + `<bdi dir="ltr">${dgOps(esc(m[0]))}</bdi>`;
    last = m.index + m[0].length;
  }
  return out + dgOps(mdx(t.slice(last)));
}
function dgFormulaLines(expr) {
  const out = [];
  String(expr || '').split(/\s*⇔\s*/).forEach((seg, i) => {
    if (i) out.push({ sep: '⇕' });
    seg.split(/\s+[•|]\s+/).forEach((x, j) => {
      if (j) out.push({ rule: 1 });
      x.split(/،\s*ثم\s+/).forEach((y, k) => { if (k) out.push({ sep: 'ثم' }); if (y.trim()) out.push({ text: y.trim() }); });
    });
  });
  return out;
}
function dgFormulaLine(t) {
  let lab = '';
  const m = t.match(/^([^=:]{2,32}):\s+(.+)$/);
  if (m) { lab = m[1]; t = m[2]; }
  const ar = /[\u0600-\u06FF]/.test(t);
  const eq = t.indexOf(' = ');
  const lhs = ar && eq > 0 ? t.slice(0, eq) : '';
  const rhs = lhs ? t.slice(eq + 3) : t;
  return `<p class="fm-line" dir="${ar || lab ? 'rtl' : 'ltr'}">${lab ? `<span class="fm-lab">${mdx(lab)}</span>` : ''}${lhs ? `<span class="fm-lhs">${dgMath(lhs)}</span> <span class="op op-eq">=</span> ` : ''}<span class="fm-rhs">${dgMath(rhs)}</span></p>`;
}

/* ---------- renderers (each returns the figure body) ---------- */
const DG_RENDER = {
  /* ordered process: numbered nodes joined by arrows; vertical on phones, a right→left row on wide figures (≤ 5 steps) */
  flow(g) {
    const s = dgList(g.steps); const n = s.length; if (!n) return '';
    return `<ol class="fl${n <= 5 ? ' fl-row' : ''}" data-n="${n}">${s.map((x, i) => `<li class="fl-s" style="--c:${DG_RAMP(i, n)};--cn:${DG_RAMP(Math.min(i + 1, n - 1), n)}"><span class="fl-k" aria-hidden="true">${AR(i + 1)}</span><div class="fl-b"><b class="fl-t">${mdx(x.t)}</b>${x.d ? `<span class="fl-d">${mdx(x.d)}</span>` : ''}</div></li>`).join('')}</ol>`;
  },
  /* developmental / sequential stages: blocks with a tag (often an age range), chevrons show the direction */
  stages(g) {
    const it = dgList(g.items); const n = it.length; if (!n) return '';
    const cols = n <= 4 ? n : Math.ceil(n / 2);
    return `<ol class="sg" data-n="${n}" style="--cols:${cols}">${it.map((x, i) => `<li class="sg-i${i % cols === cols - 1 ? ' row-end' : ''}" style="--c:${DG_RAMP(i, n)}"><div class="sg-h"><span class="sg-k" aria-hidden="true">${AR(i + 1)}</span><b class="sg-name">${mdx(x.name)}</b>${x.tag ? `<span class="sg-tag">${mdx(x.tag)}</span>` : ''}</div>${dgList(x.points).length ? `<ul class="sg-pts">${dgList(x.points).map(p => `<li>${mdx(p)}</li>`).join('')}</ul>` : ''}${i < n - 1 ? '<i class="sg-a" aria-hidden="true"></i>' : ''}</li>`).join('')}</ol>`;
  },
  /* hierarchy, data bottom first: a centred pyramid (bottom widest) with the names; the descriptions sit
     beside each band on wide figures and in a key under the pyramid on phones */
  pyramid(g) {
    const lv = dgList(g.levels); const n = lv.length; if (!n) return '';
    const top = n <= 3 ? 46 : n === 4 ? 42 : n === 5 ? 40 : 38;
    const step = n > 1 ? (100 - top) / (n - 1) : 0;
    const w = i => 100 - step * i;
    const order = lv.map((x, i) => ({ x, i })).reverse();
    const bands = order.map(({ x, i }) => {
      const wi = w(i), wt = wi - (step || 12);
      const inset = (wi - wt) / 2 / wi * 100;
      return `<li class="py-band" style="--w:${wi.toFixed(2)}%;--in:${inset.toFixed(2)}%;--pi:${((wi - wt) / 2).toFixed(2)}%;--c:${DG_RAMP(i, n)}"><span class="py-sh"><b>${mdx(x.t)}</b></span></li>`;
    }).join('');
    const key = order.map(({ x, i }) => `<li class="py-k" style="--c:${DG_RAMP(i, n)}"><b>${mdx(x.t)}</b>${x.d ? `<span>${mdx(x.d)}</span>` : ''}</li>`).join('');
    return `<div class="py" style="--n:${n}"><ol class="py-stack" aria-label="من القمة إلى القاعدة">${bands}</ol><ul class="py-key">${key}</ul></div>`;
  },
  /* loop: the steps sit on a closed track (right column down, left column up on phones; top row right→left,
     bottom row left→right on wide figures); arrows between neighbours, the last one returns to step 1 */
  cycle(g) {
    const s = dgList(g.steps); const n = s.length; if (!n) return '';
    const m = Math.floor(n / 2), odd = n % 2 === 1, mid = odd ? m + 1 : 0;
    const cards = s.map((x, k) => {
      const i = k + 1; let nr, nc, an, wr, wc, aw;
      if (odd && i === mid) { nr = String(m + 1); nc = '1 / span 2'; an = 'upl'; wr = '1 / span 2'; wc = String(m + 1); aw = 'rightb'; }
      else if (i <= m) { nr = i; nc = 1; an = i < m || odd ? 'down' : 'left'; wr = 1; wc = i; aw = i < m || odd ? 'left' : 'down'; }
      else { const r = n + 1 - i; nr = r; nc = 2; an = i === n ? 'right' : 'up'; wr = 2; wc = r; aw = i === n ? 'up' : 'right'; }
      return `<li class="cy-s${odd && i === mid ? ' turn' : ''}" style="--c:${DG_K(k)};--nr:${nr};--nc:${nc};--wr:${wr};--wc:${wc}"><div class="cy-h"><span class="cy-k" aria-hidden="true">${AR(i)}</span><b class="cy-t">${mdx(x.t)}</b></div>${x.d ? `<span class="cy-d">${mdx(x.d)}</span>` : ''}<i class="cy-a cy-an a-${an}" aria-hidden="true"></i><i class="cy-a cy-aw a-${aw}" aria-hidden="true"></i></li>`;
    }).join('');
    return `<ol class="cy" data-n="${n}" style="--wcols:${m + (odd ? 1 : 0)}">${cards}</ol><p class="cy-loop">${I.refresh}<span>بعد الخطوة ${AR(n)} تعود الدورة إلى الخطوة ${AR(1)}</span></p>`;
  },
  /* centre + branches (colour per branch, leaves inherit it): a tree on phones, branches around the centre on wide figures */
  mindmap(g) {
    const b = dgList(g.branches); const n = b.length; if (!n && !g.center) return '';
    const half = Math.ceil(n / 2);
    const card = (x, i) => {
      const side = i < half ? 0 : 1, gi = side ? i - half : i, gn = side ? n - half : half;
      const cls = ['mm-b', i === 0 ? 'first' : '', i === n - 1 ? 'last' : '', gi === 0 ? 'g-first' : '', gi === gn - 1 ? 'g-last' : ''].filter(Boolean).join(' ');
      const lv = dgList(x.leaves);
      return `<div class="${cls}" style="--c:${DG_K(i)}"><b class="mm-bt">${mdx(x.t)}</b>${lv.length ? `<ul class="mm-lv">${lv.map(l => `<li>${mdx(l)}</li>`).join('')}</ul>` : ''}</div>`;
    };
    return `<div class="mm" data-n="${n}"><p class="mm-c">${mdx(g.center)}</p><div class="mm-side mm-r">${b.slice(0, half).map(card).join('')}</div><div class="mm-side mm-l">${b.slice(half).map((x, j) => card(x, j + half)).join('')}</div></div>`;
  },
  /* grid with row and column headers; ≥ 3 columns become one card per row on narrow figures */
  matrix(g) {
    const cols = dgList(g.cols); const k = cols.length; const rows = dgList(g.rows); if (!k || !rows.length) return '';
    const w0 = k >= 3 ? 23 : k === 2 ? 29 : 40;
    return `<table class="mx${k >= 3 ? ' mx-many' : ''}" data-k="${k}"><colgroup><col style="width:${w0}%">${cols.map(() => '<col>').join('')}</colgroup><thead><tr><th scope="col" class="mx-corner">${g.corner ? `<span>${mdx(g.corner)}</span>` : ''}</th>${cols.map((c, j) => `<th scope="col" class="mx-ch" style="--c:${DG_K(j)}">${mdx(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><th scope="row" class="mx-rh">${mdx(r.h)}</th>${cols.map((c, j) => `<td style="--c:${DG_K(j)}"><span class="mx-lab">${mdx(c)}</span><span class="mx-v">${mdx((r.cells || [])[j])}</span></td>`).join('')}</tr>`).join('')}</tbody></table>`;
  },
  /* 2–3 concepts in columns facing each other across a «versus» axis; 3 stack on phones */
  versus(g) {
    const it = dgList(g.items); const n = it.length; if (!n) return '';
    return `<div class="vs" data-n="${n}">${it.map((x, i) => `${i ? `<span class="vs-x" aria-hidden="true"><i>${DG_ICON.versus}</i></span>` : ''}<div class="vs-i" style="--c:${DG_K(i)}"><div class="vs-h"><b>${mdx(x.title)}</b>${x.tag ? `<span class="vs-tag">${mdx(x.tag)}</span>` : ''}</div><ul class="vs-pts">${dgList(x.points).map(p => `<li>${mdx(p)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  },
  /* formula on a squared-paper board, its symbols, then a worked example ending in a highlighted result */
  formula(g) {
    const lines = dgFormulaLines(g.expr);
    const board = lines.length ? `<div class="fm-board">${lines.map(l => l.sep ? `<span class="fm-sep" aria-hidden="true">${esc(l.sep)}</span>` : l.rule ? '<hr class="fm-rule">' : dgFormulaLine(l.text)).join('')}</div>` : '';
    const parts = dgList(g.parts);
    const pHTML = parts.length ? `<dl class="fm-parts">${parts.map(p => `<div class="fm-part"><dt class="fm-sym">${dgMath(p.sym)}</dt><dd class="fm-means">${mdx(p.means)}</dd></div>`).join('')}</dl>` : '';
    const ex = g.example || null;
    const given = ex ? dgList(ex.given) : [], steps = ex ? dgList(ex.steps) : [];
    const eHTML = ex && (given.length || steps.length || ex.result) ? `<div class="fm-ex"><p class="fm-ex-h">${I.bulb}<span>مثال محلول</span></p>${given.length ? `<div class="fm-given"><span class="fm-gl">المعطيات</span><ul>${given.map(x => `<li>${dgMath(x)}</li>`).join('')}</ul></div>` : ''}${steps.length ? `<ol class="fm-steps">${steps.map((x, i) => `<li><span class="fm-n" aria-hidden="true">${AR(i + 1)}</span><span>${dgMath(x)}</span></li>`).join('')}</ol>` : ''}${ex.result ? `<p class="fm-res">${I.check}<span>${dgMath(ex.result)}</span></p>` : ''}</div>` : '';
    return board + pHTML + eHTML;
  },
  /* horizontal bars from a right-hand baseline, scaled to the largest value, every value written at the bar end */
  bars(g) {
    const d = dgList(g.data); if (!d.length) return '';
    const vals = d.map(x => Number(x.value) || 0); const max = Math.max(0, ...vals);
    const unit = String(g.unit || '').trim(); const pct = unit === '٪' || unit === '%';
    const fmt = v => String(Math.round(v * 100) / 100) + (pct ? '٪' : '');
    const vr = Math.max(...vals.map(v => fmt(v).length)) * 0.62 + 0.9;
    return `${unit && !pct ? `<p class="br-unit">الوحدة: ${mdx(unit)}</p>` : ''}<div class="br" style="--vr:${vr.toFixed(2)}em">${d.map((x, i) => `<div class="br-row"><span class="br-l">${mdx(x.label)}</span><span class="br-tr"><span class="br-b${vals[i] === max ? ' is-max' : ''}" style="--v:${max > 0 ? (Math.max(0, vals[i]) / max).toFixed(4) : 0}"></span><b class="br-v">${fmt(vals[i])}</b></span></div>`).join('')}</div>`;
  },
  /* ordered levels, lowest at the bottom; a dashed threshold separates the low and high groups */
  ladder(g) {
    const lv = dgList(g.levels); const n = lv.length; if (!n) return '';
    const low = Number.isFinite(+g.low) ? +g.low : n;
    const cut = low > 0 && low < n ? `<li class="ld-cut" aria-hidden="true"><span class="ld-up">${mdx(g.highLabel || 'عليا')}</span><span class="ld-dn">${mdx(g.lowLabel || 'دنيا')}</span></li>` : '';
    return ladder(lv, low, g.marks, cut);
  },
  /* two ordered scales side by side; levels that differ between them carry the red-pen outline */
  ladders2(g) {
    const L = dgList((g.left || {}).levels), R = dgList((g.right || {}).levels); if (!L.length && !R.length) return '';
    const low = Number.isFinite(+g.low) ? +g.low : 3;
    const changed = L.map((v, i) => v !== R[i] ? i : -1).filter(i => i >= 0);
    return `<div class="l2"><div class="l2-c"><p class="l2-h">${mdx((g.left || {}).title)}</p>${ladder(L, low, changed)}</div><div class="l2-c"><p class="l2-h">${mdx((g.right || {}).title)}</p>${ladder(R, low, changed)}</div></div><div class="ld-legend"><span><i class="lo"></i>مستويات دنيا</span><span><i class="hi"></i>مستويات عليا</span>${changed.length ? '<span><i class="mk"></i>ما تغيّر بين النسختين</span>' : ''}</div>`;
  },
  /* a sentence cut into coloured parts, each part labelled underneath */
  anatomy(g) {
    const parts = dgList(g.parts); if (!parts.length) return '';
    return `<div class="an">${parts.map(p => `<span class="an-p" style="--c:var(--k${DG_ROLE[p.role] || 1})"><span class="an-t">${mdx(p.t)}</span>${p.label ? `<span class="an-l">${mdx(p.label)}</span>` : ''}</span>`).join('')}</div>`;
  },
  domains(g) {
    const it = dgList(g.items); if (!it.length) return '';
    return `<div class="dg-domains">${it.map(x => `<div class="dgd ${esc(x.key)}">${I[x.key] || ''}<b>${mdx(x.title)}</b><span>${mdx(x.sub)}</span>${x.ex ? `<em>${mdx(x.ex)}</em>` : ''}</div>`).join('')}</div>`;
  },
};
/* anatomy roles: c1…c5 (new lessons) and the behavioural-objective roles (golden lesson) → five distinct colours */
const DG_ROLE = { c1: 1, c2: 2, c3: 3, c4: 4, c5: 5, verb: 1, condition: 2, learner: 3, content: 4, criterion: 5 };
const DG_CAP = {
  domains: () => 'الرأس والقلب واليد: ثلاثة أنواع من التغير في المتعلم',
  anatomy: g => dgList(g.parts).some(p => p.role === 'verb') ? 'تشريح الهدف السلوكي: كل لون مكوّن' : '',
};

function diagramHTML(g) {
  if (!g || typeof g !== 'object' || !DG_RENDER[g.type]) return '';
  let body = '';
  try { body = DG_RENDER[g.type](g); } catch (e) { console.error('diagramHTML', g.type, e); return ''; }
  return body ? dgFrame(g.type, g, body, DG_CAP[g.type] ? DG_CAP[g.type](g) : '') : '';
}
/* a staircase of levels (lowest first in the DOM, drawn bottom-up); levels ≥ low are «high» */
function ladder(levels, low, marks, cut) {
  const lv = dgList(levels); const n = lv.length;
  const mk = Array.isArray(marks) ? marks : [];
  const lo = Number.isFinite(+low) ? +low : n;
  const rungs = lv.map((v, i) => `<li class="ld-r${i >= lo ? ' hi' : ''}${mk.includes(i) ? ' mark' : ''}" style="--w:${(56 + 44 * i / Math.max(1, n - 1)).toFixed(1)}%"><span class="ld-n" aria-hidden="true">${AR(i + 1)}</span><span class="ld-t">${mdx(v)}</span></li>`);
  if (cut) rungs.splice(lo, 0, cut);
  return `<ol class="ld">${rungs.join('')}</ol>`;
}

/* ---------- explain paragraphs ----------
   «مثال:» / «تنبيه:» / «قاعدة:» at the start (also «**قاعدة:**» and a short qualifier such as «مثال من الأحياء:»)
   → a callout whose label becomes its heading; lines that start with «- » → a list; other lines → paragraphs. */
const CALLOUTS = { 'مثال': { cls: 'co-ex', icon: 'bulb' }, 'تنبيه': { cls: 'co-warn', icon: 'alert' }, 'قاعدة': { cls: 'co-rule', icon: 'check' } };
const CALLOUT_RE = /^\s*(\*\*)?(مثال|تنبيه|قاعدة)((?:\s[^:*\n.،؛]{1,30})?)\s*:\s*/;
function rdBlocks(text) {
  let out = '', ul = [], pl = [];
  const flushP = () => { if (pl.length) { out += `<p>${pl.map(md).join('<br>')}</p>`; pl = []; } };
  const flushU = () => { if (ul.length) { out += `<ul class="rd-ul">${ul.map(x => `<li>${md(x)}</li>`).join('')}</ul>`; ul = []; } };
  for (const line of String(text).split('\n')) {
    const b = line.match(/^\s*[-•]\s+(.*)$/);
    if (b) { flushP(); ul.push(b[1]); } else if (line.trim()) { flushU(); pl.push(line.trim()); }
  }
  flushP(); flushU();
  return out;
}
function rdPara(p) {
  const s = String(p == null ? '' : p);
  const m = s.match(CALLOUT_RE);
  if (m) {
    let rest = s.slice(m[0].length);
    if (m[1]) rest = rest.startsWith('**') ? rest.slice(2).replace(/^\s+/, '') : '**' + rest;
    const c = CALLOUTS[m[2]];
    const label = (m[2] + (m[3] || '')).trim();
    return `<div class="co ${c.cls}" role="note"><p class="co-h">${I[c.icon]}<span>${esc(label)}</span></p>${rdBlocks(rest)}</div>`;
  }
  return rdBlocks(s);
}
function explainHTML(paras) {
  const a = (Array.isArray(paras) ? paras : paras ? [paras] : []).filter(p => p != null && String(p).trim());
  return a.length ? `<div class="read">${a.map(rdPara).join('')}</div>` : '';
}

/* ---------- comparison table ----------
   one real table; under 600px each row becomes a card: the aspect is its heading and every value
   carries its column name. Column colours follow --k1…--k3 like the diagrams. */
function compareHTML(c) {
  if (!c || !Array.isArray(c.cols) || !Array.isArray(c.rows) || c.cols.length < 2) return '';
  const vals = c.cols.slice(1); const k = vals.length;
  const w0 = k >= 3 ? 22 : 28;
  const head = `<thead><tr><th scope="col" class="cmp-a">${mdx(c.cols[0] || '')}</th>${vals.map((h, j) => `<th scope="col" style="--c:${DG_K(j)}">${mdx(h)}</th>`).join('')}</tr></thead>`;
  const body = c.rows.filter(Array.isArray).map(r => `<tr><th scope="row">${mdx(r[0])}</th>${vals.map((h, j) => `<td style="--c:${DG_K(j)}"><span class="cmp-lab">${mdx(h)}</span><span class="cmp-v">${mdx(r[j + 1])}</span></td>`).join('')}</tr>`).join('');
  return `<div class="cmp" data-k="${k}">${c.title ? `<p class="cmp-title">${mdx(c.title)}</p>` : ''}<table class="cmp-t"><colgroup><col style="width:${w0}%">${vals.map(() => '<col>').join('')}</colgroup>${head}<tbody>${body}</tbody></table></div>`;
}

/* ---- 04c_ref.js ---- */

/* lesson.ref  = pack of «كتاب التفوق» (SRC-TFQ)   lesson.ref2 = pack of «حقيبة منصة ميم» (SRC-MEEM)

/* ================= المقرر: one sequential course — units → lessons → step-by-step cards → lesson questions → lesson-test gate ================= */
/* C.course = {passPct, tracks:[{id,title,sub}], units:[{id,track,n,title,thread,lessons:[{id,why,soft?}]}]}
   idea.micro = {plain, hook:{situation,question,reveal}, steps:[{t,text,check:{q,options,answer,why}}], analogy?, pitfall, bridge?}
   state: S.course = { pos:{lid:{card,max,t}}, done:{lid:{at,score,via}}, checks:{ideaId:{k:{c,ok,t}}}, unitDone:{uid:{at,score}} } */
TAB_OF.course = 'course'; TAB_OF.chapter = 'course';
MODE_LABEL.gate = 'اختبار الدرس'; MODE_LABEL.lessonbank = 'أسئلة الدرس'; MODE_LABEL.unit = 'اختبار الوحدة';
const COURSE = C.course || { passPct: 0.8, tracks: [], units: [] };
const TRACK_ORDER = ['edu', 'prof', 'quant', 'verbal'];
function courseState() {

  const c = S.course; for (const k of ['pos', 'done', 'checks', 'unitDone']) if (!c[k] || typeof c[k] !== 'object' || Array.isArray(c[k])) c[k] = {};
  return c;
}
let _CI = null;
function courseIndex() {

  const list = [], byId = {}, perTrack = {};
  for (const u of COURSE.units) {
    const tr = COURSE.tracks.find(t => t.id === u.track) || { id: u.track, title: u.track };
    u.lessons.forEach((x, i) => {
      const l = IX.lesson.get(x.id); if (!l) return;
      const arr = perTrack[tr.id] = perTrack[tr.id] || [];
      const e = { lid: x.id, l, unit: u, track: tr, i, k: arr.length, why: x.why || '', soft: x.soft || [] };
      list.push(e); byId[x.id] = e; arr.push(e);

  return (_CI = { list, byId, perTrack });
}
/* a lesson counts as passed when its gate test was passed here, or when mastery evidence already proves it */
function courseLessonDone(lid) {
  const c = courseState(); if (c.done[lid]) return c.done[lid];
  const l = IX.lesson.get(lid); if (!l || l.status !== 'complete') return null;
  const st = lessonStatus(l); if (['initial', 'proven', 'due'].includes(st.key)) return { via: 'mastery', at: 0, score: st.lacc };
  return null;
}
const coursePrev = lid => { const ci = courseIndex(), e = ci.byId[lid]; return e && e.k > 0 ? ci.perTrack[e.track.id][e.k - 1] : null; };
const courseNextOf = lid => { const ci = courseIndex(), e = ci.byId[lid]; const arr = e ? ci.perTrack[e.track.id] : []; return e && e.k < arr.length - 1 ? arr[e.k + 1] : null; };

function courseNext() {

  if (inProg) return { e: inProg, why: 'تابع من حيث توقفت', resume: true };
  for (const tid of TRACK_ORDER) {
    const arr = ci.perTrack[tid] || []; const nx = arr.find(e => !courseLessonDone(e.lid));
    if (nx && courseOpen(nx.lid)) return { e: nx, why: nx.k === 0 ? `أول درس في «${nx.track.title}»` : `التالي في تسلسل المقرر بعد اجتياز «${arr[nx.k - 1].l.title.split(/[:،(]/)[0].trim()}»` };
  }
  return null;
}
function courseProgress() { const ci = courseIndex(); const done = ci.list.filter(e => courseLessonDone(e.lid)).length; return { done, total: ci.list.length, pct: ci.list.length ? done / ci.list.length : 0 }; }

function checkStats(idea) { const m = idea.micro; const ch = checksOf(idea.id); const n = m ? m.steps.length : 0; const ans = Object.values(ch); return { n, done: ans.length, ok: ans.filter(a => a.ok).length }; }

const AI_RULES = `أنت «مساعد إتقان»، مساعد تعليمي داخل منصة شخصية لمعلم أحياء سعودي في المرحلة الثانوية يستعد للاختبار التربوي العام للرخصة المهنية (هيئة تقويم التعليم والتدريب).
قواعد إلزامية:
1) اكتب بالعربية الفصحى المبسطة، بإيجاز ودون مقدمة أو خاتمة، في حدود 150 كلمة ما لم يُطلب غير ذلك.
2) اعتمد على «المادة المعتمدة» المرفقة. إذا احتجت معلومة ليست فيها فاكتب قبلها: «(معرفة عامة غير موثقة في مصادرك)».
3) إذا سُئلت عن أمر لا يدعمه دليل في المادة ولا تعرفه يقينًا فقل: «لا يتوفر دليل على ذلك في المصادر المعتمدة لديك».
4) لا تخترع أرقام صفحات ولا أوزانًا ولا عدد أسئلة ولا مدة اختبار ولا أرقام مواد نظامية.
5) لا تبنِ الحل على قاعدة سطحية (كلمة تعني إجابة)؛ وضّح الخاصية المميزة وطريقة التفكير.
6) استخدم مثالًا من المدرسة السعودية أو من تدريس الأحياء عند الفائدة.`;
const AI = {
  st: 'checking', fn: null, ctl: null,
  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') { this.st = 'off'; return; }
    try { const f = await window.claude.use('sample'); this.fn = f; this.st = f ? 'ready' : 'off'; } catch (e) { this.st = 'off'; }
    if (['idea', 'run', 'results', 'more', 'lesson'].includes(UI.view)) render();
  },
  async run(targetId, prompt, noCache) {
    const box = document.getElementById(targetId); if (!box) return;
    if (!this.fn) { box.innerHTML = notice('warn', 'المساعد غير متاح في هذا العرض. يعمل عند فتح المنصة داخل Claude بعد موافقتك على استخدامه.'); return; }
    if (this.ctl) { try { this.ctl.abort(); } catch (e) { } }
    const ctl = new AbortController(); this.ctl = ctl;
    box.innerHTML = `<div class="ai"><div class="tag">${I.spark}مولّد بالمساعد · ليس مصدرًا معتمدًا ولا يُحتسب تعلمًا أو إتقانًا</div><div class="out">يفكر…</div><div class="aibar"><button class="btn quiet sm" data-act="aiStop">${I.stop}إيقاف</button></div></div>`;
    const out = box.querySelector('.out'), bar = box.querySelector('.aibar');
    const opts = { signal: ctl.signal, onText: ({ text }) => { out.innerHTML = md(text); } };
    if (noCache) opts.cache = false;
    try {
      const r = await this.fn(prompt, opts);
      out.innerHTML = md(r.text) + (r.truncated ? '<br><span class="tiny faint">(قُطع الرد لطوله؛ اطلب أقل)</span>' : '');
      bar.innerHTML = '';
    } catch (e) {
      const code = e && e.code;
      if (code === 'cancelled') { out.innerHTML = e.text ? md(e.text) : 'أُوقف.'; bar.innerHTML = ''; return; }
      const msg = { not_granted: 'لم يُسمح للمنصة باستخدام المساعد في هذا العرض.', sampling_disabled: 'المساعد غير متاح لهذا الحساب.', not_declared: 'المساعد غير مفعل في هذه النسخة.', rate_limited: 'بلغت حد الاستخدام مؤقتًا؛ حاول لاحقًا.', session_expired: 'انتهت الجلسة؛ سجّل الدخول مجددًا.', refused: 'لم يستطع المساعد الإجابة عن هذا الطلب؛ غيّر صياغته.', prompt_too_large: 'الطلب أطول من المسموح.', empty_completion: 'لم يصل رد؛ بسّط الطلب.' }[code] || 'تعذر الاتصال بالمساعد؛ أعد المحاولة.';
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) this.st = 'off';
      out.innerHTML = (e && e.text ? md(e.text) + '<br>' : '') + `<span style="color:var(--pen)">${esc(msg)}</span>`; bar.innerHTML = '';
    }
  },
};

   2. an install manifest built at runtime (start_url = this page) → «إضافة إلى الشاشة الرئيسية» gives an app icon;
   3. a downloadable copy of the page with the learner's progress embedded (file for a laptop or an Android phone). */

/* ---------- quick challenge 1: the minute sprint ---------- */
let SPR = null, MATCH = null, CARDS = null;
/* ideas the challenges draw from: the studied ones; before the first idea is studied, the next lesson's ideas */
function sprintSource() {
  const ids = C.ideas.filter(i => S.studied[i.id]).map(i => i.id);
  if (ids.length) return { ideas: ids, lesson: null };
  const nx = nextIdea();
  return nx ? { ideas: ideasOf(nx.lesson.id).map(i => i.id), lesson: nx.lesson } : { ideas: [], lesson: null };
}
const qLen = q => String(q.stem).length + sum(q.options.map(o => String(o).length));
function sprintQueue(seed) {
  const src = sprintSource(), set = new Set(src.ideas);
  const inds = new Set(src.ideas.flatMap(id => (IX.idea.get(id) || {}).inds || []));
  const mine = q => set.has(q.idea);
  const shortFirst = qs => shuffle(qs.filter(q => qLen(q) <= 260), seed).concat(shuffle(qs.filter(q => qLen(q) > 260), seed + '·'));
  const out = [], fams = new Set();
  const add = qs => { for (const q of shortFirst(qs)) { if (out.length >= 40) break; if (!SPRINT_POOLS.includes(q.pool) || fams.has(fam(q))) continue; fams.add(fam(q)); out.push(q); } };
  /* unseen first: the reference-book bank, then practice items left over from studied ideas, then official training
     items on the same indicators. Before anything is studied, practice items stay reserved for the lesson itself. */
  add(pickQuestions({ pred: mine, pools: ['ref-train'] }));
  if (!src.lesson) add(pickQuestions({ pred: mine, pools: ['practice'] }));
  add(pickQuestions({ pred: q => inds.has(q.ind), pools: ['official-train'] }));
  if (src.lesson && out.length < 8) add(pickQuestions({ pred: mine, pools: ['practice'] }));
  const fresh = out.length;
  if (out.length < 25) add(pickQuestions({ pred: mine, pools: ['ref-train', 'practice'], unseen: false }));   /* repeats last: never counted as new */
  return { src, qs: out, fresh };
}
function sprLeft() { return SPR && SPR.start ? Math.max(0, SPRINT_MS - (now() - SPR.start)) : SPRINT_MS; }
function sprTick() {
  if (!SPR || SPR.phase !== 'run') { clearInterval(SPR && SPR.int); return; }
  const left = sprLeft();
  if (UI.view === 'sprint') {
    const sec = $('#sprSec'), val = $('#sprRing .val'), w = $('#sprRing');
    if (sec) sec.textContent = AR(Math.ceil(left / 1000));
    if (val) { const full = Number(val.style.getPropertyValue('--full')) || 0; val.setAttribute('stroke-dashoffset', (full * (1 - left / SPRINT_MS)).toFixed(2)); }
    if (w) w.classList.toggle('low', left <= 10e3);
  }
  if (left <= 0 && !SPR.flash) sprEnd();
}
function sprEnd() {
  if (!SPR || SPR.phase !== 'run') return;
  clearInterval(SPR.int); SPR.phase = 'end'; SPR.end = now();
  const ok = SPR.ans.filter(a => a.ok).length;
  if (SPR.ans.length >= 5) S.chal[SPR.id] = { k: 'sprint', t: now(), n: SPR.ans.length, ok };   /* a finished challenge needs real answers */
  SPR.record = ok > (SPR.best0 || 0) && ok > 0;
  if (ok > (S.best.sprint || 0)) S.best.sprint = ok;
  Store.touch();
  if (SPR.snap) ENG.queue.push(...engMasteryGains(SPR.snap));
  if (SPR.record && SPR.best0) ENG.queue.push({ k: 'record', text: `تحدي الدقيقة: ${AR(ok)} صحيحة` });
  if (UI.view === 'sprint') render();
}
function sprAdvance() {
  if (!SPR || SPR.phase !== 'run') return;
  SPR.flash = null; SPR.i++;
  if (sprLeft() <= 0 || SPR.i >= SPR.queue.length) { if (SPR.i >= SPR.queue.length) SPR.out = true; sprEnd(); return; }
  SPR.qStart = now();
  if (UI.view === 'sprint') render();
}
function sprTicker() { if (SPR && SPR.phase === 'run') { clearInterval(SPR.int); SPR.int = setInterval(sprTick, 100); sprTick(); } }

/* ---------- quick challenge 2: term matching (retrieval only: no attempts, no mastery) ---------- */
function matchNew() {
  const src = sprintSource(), seed = uid();
  const ideas = shuffle(src.ideas.map(id => IX.idea.get(id)).filter(i => i && (i.terms || []).length), seed);
  const norm = s => String(s).replace(/[ً-ْ«»"'()،.:]/g, '').replace(/\s+/g, ' ').trim();
  const pools = ideas.map(i => { const ts = (i.terms || []).filter(t => t && t.t && t.d); const short = ts.filter(t => String(t.d).length <= 130); return shuffle(short.length ? short : ts, seed + i.id).map(t => ({ t, idea: i })); });
  const pairs = [], seenT = new Set(), seenD = new Set();
  for (let round = 0; pairs.length < 5 && round < 12; round++) for (const p of pools) {
    if (pairs.length >= 5) break;
    while (p.length) { const x = p.shift(); const nt = norm(x.t.t), nd = norm(x.t.d); if (seenT.has(nt) || seenD.has(nd)) continue; seenT.add(nt); seenD.add(nd); pairs.push({ k: pairs.length, t: x.t.t, d: x.t.d, idea: x.idea.id }); break; }
  }
  return { id: uid(), src, pairs, tOrder: shuffle(pairs.map(p => p.k), seed + 't'), dOrder: shuffle(pairs.map(p => p.k), seed + 'd'), sel: null, done: {}, err: 0, start: 0, end: 0, bad: null, pop: null };
}
function matchTick() {
  clearInterval(matchTick.int);
  matchTick.int = setInterval(() => { if (!MATCH || MATCH.end || UI.view !== 'match') { clearInterval(matchTick.int); return; } const el = $('#mtTime'); if (el && MATCH.start) el.textContent = fmtSec(Math.floor((now() - MATCH.start) / 1000)); }, 250);
}
ACT.engMatchPick = d => {
  const M = MATCH; if (!M || M.end || UI.view !== 'match') return;
  const s = d.s, k = Number(d.k);
  if (M.done[k] != null) return;
  if (!M.start) { M.start = now(); matchTick(); }
  M.bad = null; M.pop = null;
  if (!M.sel || M.sel.s === s) { M.sel = M.sel && M.sel.s === s && M.sel.k === k ? null : { s, k }; render(); return; }
  const tk = s === 't' ? k : M.sel.k, dk = s === 'd' ? k : M.sel.k; M.sel = null;
  if (tk === dk) {
    M.done[tk] = Object.keys(M.done).length + 1; M.pop = tk;
    if (Object.keys(M.done).length === M.pairs.length) {
      M.end = now(); const ms = M.end - M.start;
      S.chal[M.id] = { k: 'match', t: now(), ms, err: M.err };
      M.best0 = S.best.match || 0;
      if (M.err === 0 && (!S.best.match || ms < S.best.match)) { S.best.match = ms; M.record = true; if (M.best0) ENG.queue.push({ k: 'record', text: `طابق المصطلح بلا أخطاء: ${AR(Math.round(ms / 1000))} ث` }); }
      Store.touch();
    }
  } else { M.err++; M.bad = { t: tk, d: dk }; setTimeout(() => { if (MATCH === M && M.bad && M.bad.t === tk && M.bad.d === dk) { M.bad = null; if (UI.view === 'match') render(); } }, 480); }
  render();
};

/* ---------- quick challenge 3: today's cards (retrieval only; ratings reuse S.cards like the lesson cards) ---------- */
function cardsNew() {
  const src = sprintSource(), due = new Set(dueIdeas().map(i => i.id)), tk = todayKey();
  const score = id => {
    const c = S.cards[id], r = S.recall[id]; let s, why;
    if (src.lesson) { s = 20; why = 'من الدرس التالي'; }
    else if (due.has(id)) { s = 100; why = 'مراجعة مستحقة'; }
    else if (c && c.v === 'hard') { s = 80; why = 'قيّمتها صعبة'; }
    else if (r && r.v === 'none') { s = 70; why = 'لم تتذكرها في الاسترجاع'; }
    else if (r && r.v === 'part') { s = 55; why = 'تذكرتها جزئيًا'; }
    else if (c && c.v === 'ok') { s = 35; why = 'قيّمتها متوسطة'; }
    else if (!c) { s = 30; why = 'لم تراجع بطاقتها بعد'; }
    else { s = 10; why = 'قيّمتها سهلة'; }
    if (c && dayKey(c.t) === tk) s -= 200;   /* already reviewed today: last */
    return { id, s, why, t: c ? c.t : 0 };
  };
  const items = src.ideas.filter(id => (IX.idea.get(id) || {}).card).map(score).sort((a, b) => b.s - a.s || a.t - b.t).slice(0, 10);
  return { id: uid(), src, items, i: 0, flipped: false, rated: {} };
}

      <span class="jr-band"><span class="jr-n s-${key}${isHere ? ' here' : ''}${ring ? ' ring' : ''}" data-lit="${key === 'new' ? 0 : 1}" style="--x:${x}${ring}">${isHere ? '<span class="jr-pin">أنت هنا</span>' : ''}${key === 'needs' ? '<span class="jr-warn">!</span>' : ''}${inner}</span></span>
      <span class="jr-tx">${stLine}<span class="jr-t">${esc(l.title)}</span><span class="jr-meta">${AR(l.minutes)} د · ${plural(ideas.length || ideasOf(l.id).length, 'فكرة واحدة', 'فكرتان', 'أفكار', 'فكرة')}${ex}</span></span></button>`;
  };
  let allDone = true;
  for (const s of C.stages) {
    if (s.n >= 5) continue;
    const ls = C.lessons.filter(l => l.stage === s.n); if (!ls.length) continue;
    const sts = ls.map(l => ({ l, st: lessonStatus(l) }));
    const done = sts.filter(x => ['initial', 'proven'].includes(x.st.key)).length, started = sts.filter(x => !['new', 'planned'].includes(x.st.key)).length;
    if (done < ls.length) allDone = false;
    const state = done === ls.length ? 'done' : started ? 'cur' : 'todo';
    rows.push(`<div class="jr-m ${state}"><span class="jr-band"><span class="jr-mk" data-lit="${started ? 1 : 0}"><small>المرحلة</small><b class="num">${AR(s.n)}</b></span></span>
      <span class="jr-tx"><span class="eyebrow">المرحلة ${AR(s.n)} من ٤${state === 'done' ? ' · مكتملة' : ''}</span><span class="jr-mt">${esc(s.name)}</span><span class="jr-meta">${AR(done)} متقن من ${AR(ls.length)}${started > done ? ` · ${AR(started - done)} قيد التعلم` : ''}</span><span class="jr-bar" aria-hidden="true"><i class="d" style="width:${(100 * done / ls.length).toFixed(1)}%"></i><i class="s" style="width:${(100 * (started - done) / ls.length).toFixed(1)}%"></i></span></span></div>`);
    for (const x of sts) rows.push(lessonRow(x.l, x.st));
  }
  const fin = C.stages.find(s => s.n === 5) || { name: 'تدريب مختلط ومحاكاة' };
  rows.push(`<div class="jr-fin${allDone ? ' done' : ''}${!here ? ' is-here' : ''}"><span class="jr-band"><span class="jr-fk${!here ? ' here' : ''}" data-lit="${allDone ? 1 : 0}">${!here ? '<span class="jr-pin">أنت هنا</span>' : ''}${I.flag}</span></span>
    <span class="jr-tx"><span class="eyebrow">خط النهاية · المرحلة ٥</span><span class="jr-mt">${esc(fin.name)}</span><span class="jr-meta">بعد الدروس: تدريب مختلط موقوت، واختبارات تراكمية، واختبار تدريبي شامل.</span><span><button class="btn ghost sm" data-act="tab" data-t="practice">${I.target}إلى التدريب</button></span></span></div>`);
  const legend = [['new', 'لم يبدأ'], ['learning', 'يتعلم'], ['initial', 'متقن أوليًا'], ['proven', 'إتقان مثبت'], ['due', 'حان موعد المراجعة']];
  return `<div class="jr-head"><p class="small muted">ترتيب مقترح يبدأ بالأسس التي تقوم عليها بقية الدروس، ثم الفهم والتمييز، ثم التطبيق، ثم المواقف المركبة. خطة اليوم تختار منه حسب أولويتك (وزن المعيار، ودقتك، وتكرار الموضوع في الاختبار) دون أن تتجاوز المتطلبات السابقة.</p>
    <div class="jr-legend" aria-label="دليل الألوان">${legend.map(([key, l]) => `<span><i class="jr-n mini s-${key}">${key === 'proven' ? EI.star : key === 'initial' ? I.check : ''}</i>${l}</span>`).join('')}</div>
    <div class="btns">${here ? `<button class="btn ghost sm" data-act="engJump">${I.down}انتقل إلى «أنت هنا»</button>` : ''}<button class="btn quiet sm" data-act="go" data-v="map" data-p='{"mode":"path","list":1}'>${I.note}عرض كقائمة</button></div></div>
  <div class="jr" id="journey"><svg class="jr-svg" aria-hidden="true"></svg>${rows.join('')}</div>`;
}
ACT.engJump = () => { const el = $('.jr-l.is-here'); if (el) el.scrollIntoView({ behavior: engReduced() ? 'auto' : 'smooth', block: 'center' }); };
function engDrawJourney() {
  const box = document.getElementById('journey'); if (!box) { if (ENG.ro) { ENG.ro.disconnect(); ENG.ro = null; } return; }
  const draw = () => {
    const svg = box.querySelector('.jr-svg'); if (!svg || !box.isConnected) return;
    const r0 = box.getBoundingClientRect(); if (!r0.width) return;
    const pts = [...box.querySelectorAll('.jr-n:not(.mini), .jr-mk, .jr-fk')].map(n => { const r = n.getBoundingClientRect(); return { x: r.left + r.width / 2 - r0.left, y: r.top + r.height / 2 - r0.top, lit: n.dataset.lit === '1' }; });
    if (pts.length < 2) return;
    const seg = (a, b) => { const dy = (b.y - a.y) * 0.55; return `C${a.x.toFixed(1)} ${(a.y + dy).toFixed(1)} ${b.x.toFixed(1)} ${(b.y - dy).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`; };
    let road = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`, ink = '';
    for (let i = 1; i < pts.length; i++) { road += seg(pts[i - 1], pts[i]); if (pts[i - 1].lit && pts[i].lit) ink += `M${pts[i - 1].x.toFixed(1)} ${pts[i - 1].y.toFixed(1)}${seg(pts[i - 1], pts[i])}`; }
    svg.setAttribute('viewBox', `0 0 ${r0.width.toFixed(1)} ${r0.height.toFixed(1)}`);
    svg.innerHTML = `<path class="jr-road-bg" d="${road}"/><path class="jr-road" d="${road}"/>${ink ? `<path class="jr-ink" d="${ink}"/>` : ''}`;
  };
  draw();
  if (ENG.ro) ENG.ro.disconnect();
  if (window.ResizeObserver) { ENG.ro = new ResizeObserver(() => draw()); ENG.ro.observe(box); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw).catch(() => { });
}

/* keyboard: elements drawn as role=button (the flip cards) answer Enter and Space like buttons */
document.addEventListener('keydown', e => { const el = e.target; if ((e.key === 'Enter' || e.key === ' ') && el && el.matches && el.matches('[role=button][data-act]')) { e.preventDefault(); el.click(); } });
/* ---------- render hook: entrance motion, journey path, sprint clock, engagement checks ---------- */
const engBaseRender = render;
render = function () {
  engBaseRender();
  if (Store.mode === 'boot') return;
  try {
    if (UI.view !== ENG.lastView) {
      ENG.lastView = UI.view;
      const v = document.getElementById('view');
      if (v && !engReduced()) { v.classList.remove('eng-enter'); void v.offsetWidth; v.classList.add('eng-enter'); clearTimeout(ENG.enterT); ENG.enterT = setTimeout(() => v.classList.remove('eng-enter'), 450); }
      if (UI.view === 'more' && UI.params && UI.params.eng) setTimeout(() => { const el = document.getElementById('engAch'); if (el) el.scrollIntoView({ block: 'start' }); }, 0);
    }
    if (UI.view === 'map') engDrawJourney(); else if (ENG.ro) { ENG.ro.disconnect(); ENG.ro = null; }
    if (UI.view === 'sprint') sprTicker();
    if (UI.view === 'match' && MATCH && MATCH.start && !MATCH.end) matchTick();
    engCheck();
  } catch (e) { console.error(e); }
};
if (location.hash === '#test' && window.__itqan) Object.assign(window.__itqan, { render: () => render(), engage: { stats: engStats, level: engLevel, badges: () => BADGES.map(b => ({ id: b.id, name: b.name, t: S.badges[b.id] || 0 })), sprint: () => SPR && JSON.parse(JSON.stringify({ phase: SPR.phase, id: SPR.id, served: SPR.served, ans: SPR.ans, queue: SPR.queue })), match: () => MATCH && JSON.parse(JSON.stringify({ pairs: MATCH.pairs, done: MATCH.done, err: MATCH.err, end: MATCH.end })), cards: () => CARDS && JSON.parse(JSON.stringify(CARDS)), sprintQueue: s => sprintQueue(s || 'test').qs.map(q => q.id), mergeState, normalize, recordAttempt, runStep, markPlanDone } });

})();</script>
